<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>⚔️ بابک خرمدین - قیام سرخ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #1a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        .game-wrapper {
            background: #2a1212;
            border-radius: 24px;
            border: 2px solid #8b1a1a;
            box-shadow: 0 0 80px rgba(180, 30, 30, 0.3);
            padding: 12px;
            max-width: 1100px;
            width: 100%;
            margin: 10px;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 16px 16px 0 0;
            border-bottom: 2px solid #8b1a1a;
            color: #ffd7a0;
            flex-wrap: wrap;
            gap: 6px;
        }
        .game-header h2 {
            font-size: clamp(16px, 3vw, 26px);
            font-weight: 900;
            background: linear-gradient(45deg, #ff3333, #ff8800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 50, 0, 0.3);
        }
        .game-header .stats {
            display: flex;
            gap: 14px;
            font-size: clamp(11px, 1.5vw, 16px);
            color: #ccb090;
        }
        .game-header .stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .game-header .stats .num {
            color: #ffdd44;
            font-weight: 700;
        }
        .canvas-wrap {
            position: relative;
            background: #0d0808;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1000 / 650;
            touch-action: none;
            outline: none;
            cursor: crosshair;
            border-radius: 0 0 16px 16px;
        }
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
            border-radius: 0 0 16px 16px;
            z-index: 10;
        }
        .overlay.visible {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h1 {
            font-size: clamp(36px, 7vw, 64px);
            font-weight: 900;
            color: #ff4422;
            text-shadow: 0 0 40px rgba(255, 50, 0, 0.6);
            margin-bottom: 6px;
        }
        .overlay .sub {
            font-size: clamp(16px, 2.5vw, 28px);
            color: #ffd7a0;
            margin-bottom: 6px;
        }
        .overlay .desc {
            color: #aa8866;
            font-size: clamp(13px, 1.5vw, 18px);
            margin-bottom: 20px;
            text-align: center;
            padding: 0 20px;
        }
        .btn {
            padding: 14px 44px;
            font-size: clamp(18px, 2.5vw, 26px);
            font-weight: 700;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #cc2222, #aa1111);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(200, 30, 30, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            touch-action: manipulation;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(200, 30, 30, 0.6);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .touch-controls {
            display: none;
            padding: 10px 12px 14px;
            background: rgba(0, 0, 0, 0.8);
            border-top: 2px solid #6a1a1a;
            border-radius: 0 0 16px 16px;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            touch-action: none;
        }
        @media (pointer: coarse) {
            .touch-controls {
                display: flex;
            }
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 48px);
            grid-template-rows: repeat(3, 48px);
            gap: 4px;
            flex-shrink: 0;
        }
        .dpad button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 100, 100, 0.2);
            border-radius: 12px;
            color: #ffccaa;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            transition: background 0.08s;
            cursor: pointer;
            width: 100%;
            height: 100%;
            padding: 0;
        }
        .dpad button:active {
            background: rgba(200, 50, 50, 0.3);
        }
        .dpad .empty {
            background: transparent;
            border: none;
            pointer-events: none;
        }
        .action-btns {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .action-btns button {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 1px solid rgba(255, 100, 100, 0.25);
            background: rgba(255, 255, 255, 0.06);
            color: #ffccaa;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            transition: background 0.08s;
            cursor: pointer;
        }
        .action-btns button:active {
            background: rgba(200, 50, 50, 0.25);
        }
        .action-btns .attack {
            background: rgba(200, 30, 30, 0.25);
            border-color: #cc3333;
        }
        .action-btns .attack:active {
            background: rgba(200, 30, 30, 0.5);
        }
        .controls-note {
            color: #886655;
            font-size: clamp(10px, 1vw, 13px);
            text-align: center;
            padding: 6px;
            border-top: 1px solid #3a1a1a;
            margin-top: 4px;
        }
        .controls-note kbd {
            background: #2a1212;
            padding: 2px 10px;
            border-radius: 6px;
            color: #ffaa77;
            border: 1px solid #5a2a2a;
        }
        @media (max-width: 600px) {
            .game-wrapper {
                padding: 6px;
                margin: 4px;
            }
            .dpad {
                grid-template-columns: repeat(3, 40px);
                grid-template-rows: repeat(3, 40px);
            }
            .action-btns button {
                width: 44px;
                height: 44px;
                font-size: 16px;
            }
        }
        @media (max-width: 400px) {
            .dpad {
                grid-template-columns: repeat(3, 34px);
                grid-template-rows: repeat(3, 34px);
                gap: 3px;
            }
            .action-btns button {
                width: 38px;
                height: 38px;
                font-size: 14px;
            }
            .game-header .stats {
                font-size: 10px;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="game-header">
            <h2>⚔️ بابک خرمدین</h2>
            <div class="stats">
                <span>❤️ <span class="num" id="hpDisplay">100</span></span>
                <span>⚔️ <span class="num" id="killDisplay">0</span></span>
                <span>🏹 <span class="num" id="scoreDisplay">0</span></span>
                <span>📌 <span class="num" id="levelDisplay">۱</span></span>
            </div>
        </div>

        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="1000" height="650" tabindex="0"></canvas>
            <div class="overlay visible" id="overlay">
                <h1>⚔️ بابک خرمدین</h1>
                <div class="sub">قیام سرخ جامگان</div>
                <div class="desc">مبارزه با ستمگران عرب در راه آزادی ایران</div>
                <button class="btn" id="startBtn">▶ آغاز نبرد</button>
            </div>
        </div>

        <div class="touch-controls" id="touchControls">
            <div class="dpad">
                <div class="empty"></div>
                <button data-key="w">▲</button>
                <div class="empty"></div>
                <button data-key="a">◀</button>
                <button data-key="s">▼</button>
                <button data-key="d">▶</button>
                <div class="empty"></div>
                <button data-key="shift">⚡</button>
                <div class="empty"></div>
            </div>
            <div class="action-btns">
                <button class="attack" data-key="j">⚔️</button>
                <button data-key="k">🛡️</button>
                <button data-key="space">🏃</button>
            </div>
        </div>

        <div class="controls-note">
            <kbd>W A S D</kbd> حرکت · <kbd>J</kbd> حمله · <kbd>K</kbd> سپر · <kbd>Shift</kbd> دویدن · <kbd>Space</kbd> پرش
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ================================================================
            // 1. تنظیمات
            // ================================================================
            const W = 1000,
                H = 650;
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const overlay = document.getElementById('overlay');
            const startBtn = document.getElementById('startBtn');
            const hpDisplay = document.getElementById('hpDisplay');
            const killDisplay = document.getElementById('killDisplay');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const levelDisplay = document.getElementById('levelDisplay');

            // ================================================================
            // 2. State
            // ================================================================
            const STATE = { MENU: 'MENU', PLAYING: 'PLAYING', GAMEOVER: 'GAMEOVER' };
            let state = STATE.MENU;
            let score = 0,
                kills = 0,
                level = 1;
            let gameTime = 0,
                screenShake = 0;
            let lastTimestamp = 0;
            let levelEnemyCount = 0,
                enemiesSpawned = 0;
            let bossActive = false,
                bossDefeated = false;
            let enemySpawnTimer = 0;

            // ================================================================
            // 3. بازیکن (بابک خرمدین)
            // ================================================================
            const player = {
                x: 400,
                y: 350,
                w: 34,
                h: 44,
                speed: 160,
                sprintMultiplier: 1.5,
                hp: 100,
                maxHp: 100,
                attackCooldown: 0,
                attackTimer: 0,
                isAttacking: false,
                shield: false,
                shieldCooldown: 0,
                jump: false,
                jumpVel: 0,
                grounded: true,
                facing: 1, // 1 = right, -1 = left
                hitCooldown: 0,
                combo: 0,
                comboCooldown: 0,
                animFrame: 0,
                walkCycle: 0
            };

            // ================================================================
            // 4. دشمنان (اعراب)
            // ================================================================
            const ENEMY_TYPES = {
                arab_spear: {
                    name: 'نیزه‌دار عرب',
                    color: '#d4a574',
                    colorDark: '#8b6b4a',
                    colorLight: '#f0d5b0',
                    hp: 25,
                    speed: 0.8,
                    size: 28,
                    score: 30,
                    damage: 10,
                    weapon: 'spear'
                },
                arab_sword: {
                    name: 'شمشیرزن عرب',
                    color: '#c49a6c',
                    colorDark: '#7a5a3a',
                    colorLight: '#e8c8a0',
                    hp: 30,
                    speed: 1.0,
                    size: 30,
                    score: 40,
                    damage: 12,
                    weapon: 'sword'
                },
                arab_archer: {
                    name: 'کماندار عرب',
                    color: '#b8895a',
                    colorDark: '#6a4a2a',
                    colorLight: '#dbb88a',
                    hp: 20,
                    speed: 0.6,
                    size: 26,
                    score: 35,
                    damage: 8,
                    weapon: 'bow'
                }
            };

            const BOSS_TYPES = {
                arab_general: {
                    name: 'سردار عرب',
                    color: '#8a6a3a',
                    colorDark: '#4a2a1a',
                    colorLight: '#c9a87a',
                    hp: 100,
                    speed: 0.9,
                    size: 50,
                    score: 150,
                    damage: 20,
                    weapon: 'sword',
                    isBoss: true
                },
                arab_emir: {
                    name: 'امیر عرب',
                    color: '#9a7a4a',
                    colorDark: '#5a3a2a',
                    colorLight: '#d9b88a',
                    hp: 120,
                    speed: 0.8,
                    size: 52,
                    score: 180,
                    damage: 22,
                    weapon: 'spear',
                    isBoss: true
                }
            };

            // ================================================================
            // 5. Object Pool
            // ================================================================
            class ObjectPool {
                constructor(factory, reset, initialSize = 0) {
                    this.factory = factory;
                    this.reset = reset;
                    this.pool = [];
                    for (let i = 0; i < initialSize; i++) this.pool.push(this.factory());
                }
                acquire() {
                    if (this.pool.length > 0) {
                        const obj = this.pool.pop();
                        this.reset(obj);
                        return obj;
                    }
                    return this.factory();
                }
                release(obj) { this.pool.push(obj); }
                clear() { this.pool = []; }
            }

            // ================================================================
            // 6. Pools
            // ================================================================
            function particleFactory() {
                return { x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 20, color: '#ff4422', size: 4, active: false };
            }

            function particleReset(p) {
                p.x = 0;
                p.y = 0;
                p.vx = 0;
                p.vy = 0;
                p.life = 0;
                p.maxLife = 20;
                p.color = '#ff4422';
                p.size = 4;
                p.active = false;
            }
            const particlePool = new ObjectPool(particleFactory, particleReset, 80);

            function floatFactory() {
                return { x: 0, y: 0, text: '', color: '#fff', size: 20, life: 0, maxLife: 40, vy: -1.0, active: false };
            }

            function floatReset(f) {
                f.x = 0;
                f.y = 0;
                f.text = '';
                f.color = '#fff';
                f.size = 20;
                f.life = 0;
                f.maxLife = 40;
                f.vy = -1.0;
                f.active = false;
            }
            const floatPool = new ObjectPool(floatFactory, floatReset, 15);

            // ================================================================
            // 7. Game Arrays
            // ================================================================
            let enemies = [];
            let projectiles = [];
            const activeParticles = [];
            const activeFloats = [];

            // ================================================================
            // 8. Input
            // ================================================================
            const keys = { w: false, a: false, s: false, d: false, shift: false, space: false };
            let keysJ = false,
                keysK = false;

            document.addEventListener('keydown', (e) => {
                const key = e.key;
                if (['w', 'W', 'a', 'A', 's', 'S', 'd', 'D', ' ', 'Shift', 'j', 'J', 'k', 'K'].includes(key)) e
                    .preventDefault();
                if (key === 'w' || key === 'W') keys.w = true;
                if (key === 'a' || key === 'A') keys.a = true;
                if (key === 's' || key === 'S') keys.s = true;
                if (key === 'd' || key === 'D') keys.d = true;
                if (key === 'Shift') keys.shift = true;
                if (key === ' ') keys.space = true;
                if (key === 'j' || key === 'J') keysJ = true;
                if (key === 'k' || key === 'K') keysK = true;
                if (key === 'Enter' && (state === STATE.MENU || state === STATE.GAMEOVER)) startGame();
            });

            document.addEventListener('keyup', (e) => {
                const key = e.key;
                if (['w', 'W', 'a', 'A', 's', 'S', 'd', 'D', ' ', 'Shift', 'j', 'J', 'k', 'K'].includes(key)) e
                    .preventDefault();
                if (key === 'w' || key === 'W') keys.w = false;
                if (key === 'a' || key === 'A') keys.a = false;
                if (key === 's' || key === 'S') keys.s = false;
                if (key === 'd' || key === 'D') keys.d = false;
                if (key === 'Shift') keys.shift = false;
                if (key === ' ') keys.space = false;
                if (key === 'j' || key === 'J') keysJ = false;
                if (key === 'k' || key === 'K') keysK = false;
            });

            // Touch controls
            document.querySelectorAll('#touchControls button[data-key]').forEach(btn => {
                const key = btn.dataset.key;
                const start = (e) => {
                    e.preventDefault();
                    if (key === 'w' || key === 'a' || key === 's' || key === 'd') keys[key] = true;
                    if (key === 'shift') keys.shift = true;
                    if (key === 'space') keys.space = true;
                    if (key === 'j') keysJ = true;
                    if (key === 'k') keysK = true;
                };
                const end = (e) => {
                    e.preventDefault();
                    if (key === 'w' || key === 'a' || key === 's' || key === 'd') keys[key] = false;
                    if (key === 'shift') keys.shift = false;
                    if (key === 'space') keys.space = false;
                    if (key === 'j') keysJ = false;
                    if (key === 'k') keysK = false;
                };
                btn.addEventListener('touchstart', start, { passive: false });
                btn.addEventListener('touchend', end, { passive: false });
                btn.addEventListener('touchcancel', end, { passive: false });
                btn.addEventListener('mousedown', start);
                btn.addEventListener('mouseup', end);
                btn.addEventListener('mouseleave', end);
            });

            // Canvas click to start
            canvas.addEventListener('click', () => {
                if (state === STATE.MENU || state === STATE.GAMEOVER) startGame();
            });
            canvas.addEventListener('touchstart', (e) => {
                if (state === STATE.MENU || state === STATE.GAMEOVER) startGame();
            }, { passive: true });

            startBtn.addEventListener('click', startGame);
            startBtn.addEventListener('touchend', (e) => { e.preventDefault();
                startGame(); });

            // ================================================================
            // 9. Utilities
            // ================================================================
            function rand(min, max) { return Math.random() * (max - min) + min; }

            function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

            function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

            function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

            function rectCollide(a, b) {
                return a.x < b.x + b.w && a.x + a.w > b.x &&
                    a.y < b.y + b.h && a.y + a.h > b.y;
            }

            // ================================================================
            // 10. Particle & Text Helpers
            // ================================================================
            function createParticles(x, y, color, count = 12, speed = 4, life = 20) {
                for (let i = 0; i < count; i++) {
                    const p = particlePool.acquire();
                    const angle = rand(0, Math.PI * 2);
                    const spd = rand(0.5, speed);
                    p.x = x;
                    p.y = y;
                    p.vx = Math.cos(angle) * spd;
                    p.vy = Math.sin(angle) * spd - 0.5;
                    p.life = rand(life * 0.4, life);
                    p.maxLife = life;
                    p.color = color;
                    p.size = rand(2, 6);
                    p.active = true;
                    activeParticles.push(p);
                }
            }

            function addFloatingText(x, y, text, color = '#fff', size = 22) {
                const f = floatPool.acquire();
                f.x = x;
                f.y = y;
                f.text = text;
                f.color = color;
                f.size = size;
                f.life = 40;
                f.maxLife = 40;
                f.vy = -1.0;
                f.active = true;
                activeFloats.push(f);
            }

            // ================================================================
            // 11. Spawn Enemies
            // ================================================================
            function spawnEnemy(type = null) {
                const side = randInt(0, 3);
                let x, y;
                const pad = 60;
                if (side === 0) { x = -pad;
                    y = rand(80, H - 80); } else if (side === 1) { x = W + pad;
                    y = rand(80, H - 80); } else if (side === 2) { x = rand(80, W - 80);
                    y = -pad; } else { x = rand(80, W - 80);
                    y = H + pad; }

                const types = Object.keys(ENEMY_TYPES);
                const selected = type || types[randInt(0, types.length - 1)];
                const data = ENEMY_TYPES[selected];
                const levelScale = 1 + (level - 1) * 0.1;
                const hpScale = 1 + (level - 1) * 0.08;

                enemies.push({
                    x,
                    y,
                    w: data.size,
                    h: data.size,
                    hp: data.hp * hpScale,
                    maxHp: data.hp * hpScale,
                    speed: data.speed * levelScale * (0.85 + Math.random() * 0.3),
                    type: selected,
                    color: data.color,
                    colorDark: data.colorDark,
                    colorLight: data.colorLight,
                    score: Math.round(data.score * (1 + (level - 1) * 0.05)),
                    damage: data.damage * (1 + (level - 1) * 0.05),
                    weapon: data.weapon,
                    name: data.name,
                    isBoss: false,
                    dead: false,
                    state: 'chase',
                    stunTimer: 0,
                    attackCooldown: 0,
                    patrolTimer: rand(0, 100),
                    facing: 1,
                    animFrame: 0,
                    walkCycle: 0
                });
                enemiesSpawned++;
            }

            function spawnBoss() {
                const side = randInt(0, 3);
                let x, y;
                const pad = 80;
                if (side === 0) { x = -pad;
                    y = rand(120, H - 120); } else if (side === 1) { x = W + pad;
                    y = rand(120, H - 120); } else if (side === 2) { x = rand(120, W - 120);
                    y = -pad; } else { x = rand(120, W - 120);
                    y = H + pad; }

                const types = Object.keys(BOSS_TYPES);
                const selected = types[randInt(0, types.length - 1)];
                const data = BOSS_TYPES[selected];
                const levelScale = 1 + (level - 1) * 0.08;

                enemies.push({
                    x,
                    y,
                    w: data.size,
                    h: data.size,
                    hp: data.hp * levelScale,
                    maxHp: data.hp * levelScale,
                    speed: data.speed * (0.85 + Math.random() * 0.2),
                    type: selected,
                    color: data.color,
                    colorDark: data.colorDark,
                    colorLight: data.colorLight,
                    score: data.score,
                    damage: data.damage * (1 + (level - 1) * 0.05),
                    weapon: data.weapon,
                    name: data.name,
                    isBoss: true,
                    dead: false,
                    state: 'chase',
                    stunTimer: 0,
                    attackCooldown: 0,
                    patrolTimer: 0,
                    facing: 1,
                    animFrame: 0,
                    walkCycle: 0,
                    rageMode: false,
                    rageThreshold: 0.4
                });
                bossActive = true;
                bossDefeated = false;
                addFloatingText(W / 2, 100, `⚠️ ${data.name} ظهور کرد!`, '#ff4422', 32);
                createParticles(x, y, '#ff4422', 40, 6, 30);
                screenShake = 12;
            }

            // ================================================================
            // 12. Projectile (for archer enemies)
            // ================================================================
            function spawnProjectile(x, y, targetX, targetY, damage) {
                const dx = targetX - x;
                const dy = targetY - y;
                const d = Math.hypot(dx, dy);
                if (d === 0) return;
                const speed = 4;
                projectiles.push({
                    x,
                    y,
                    vx: (dx / d) * speed,
                    vy: (dy / d) * speed,
                    damage: damage,
                    life: 120,
                    radius: 6,
                    color: '#ff8844'
                });
            }

            // ================================================================
            // 13. Start Level & Game
            // ================================================================
            function startLevel() {
                levelEnemyCount = 4 + level * 2;
                enemiesSpawned = 0;
                bossActive = false;
                bossDefeated = false;
                enemies = enemies.filter(e => e.dead);
                projectiles = [];
                enemySpawnTimer = 0;

                const initialCount = Math.min(2 + Math.floor(level / 2), 6);
                for (let i = 0; i < initialCount; i++) {
                    setTimeout(() => spawnEnemy(null), i * 400);
                }
                addFloatingText(W / 2, 70, `📍 مرحله ${level} - قیام سرخ`, '#ff8844', 30);
                updateHUD();
            }

            function startGame() {
                state = STATE.PLAYING;
                score = 0;
                kills = 0;
                level = 1;
                gameTime = 0;
                screenShake = 0;
                player.x = 400;
                player.y = 350;
                player.hp = 100;
                player.attackCooldown = 0;
                player.attackTimer = 0;
                player.isAttacking = false;
                player.shield = false;
                player.shieldCooldown = 0;
                player.hitCooldown = 0;
                player.combo = 0;
                player.comboCooldown = 0;
                player.grounded = true;
                player.jumpVel = 0;
                player.facing = 1;
                enemies = [];
                projectiles = [];
                activeParticles.length = 0;
                activeFloats.length = 0;
                bossActive = false;
                bossDefeated = false;
                overlay.classList.remove('visible');
                canvas.focus();
                startLevel();
                updateHUD();
            }

            // ================================================================
            // 14. Combat
            // ================================================================
            function playerAttack() {
                if (player.attackCooldown > 0 || player.isAttacking) return;
                player.isAttacking = true;
                player.attackTimer = 12;
                player.attackCooldown = 18;
                player.combo++;
                if (player.combo > 3) player.combo = 1;
                player.comboCooldown = 30;

                const cx = player.x + player.w / 2;
                const cy = player.y + player.h / 2;
                const range = 55;
                const hitbox = {
                    x: player.facing === 1 ? player.x + player.w : player.x - range,
                    y: player.y - 10,
                    w: range,
                    h: player.h + 20
                };

                // Hit enemies
                let hitCount = 0;
                for (let e of enemies) {
                    if (e.dead) continue;
                    if (rectCollide(hitbox, e)) {
                        const dmg = 12 + Math.floor(player.combo * 2) + Math.floor(level / 2);
                        e.hp -= dmg;
                        e.stunTimer = 20;
                        e.state = 'stunned';
                        const pushDir = player.facing;
                        e.x += pushDir * 30;
                        createParticles(e.x + e.w / 2, e.y + e.h / 2, '#ff8844', 10, 4, 15);
                        addFloatingText(e.x, e.y - 10, `-${dmg}`, '#ff4422');
                        screenShake = Math.max(screenShake, 4);
                        hitCount++;

                        if (e.hp <= 0) {
                            e.dead = true;
                            kills++;
                            score += e.score;
                            createParticles(e.x + e.w / 2, e.y + e.h / 2, '#ff4422', 25, 5, 25);
                            addFloatingText(e.x, e.y, `+${e.score} 🏹`, '#ffdd44');
                            if (e.isBoss) {
                                bossActive = false;
                                bossDefeated = true;
                                addFloatingText(W / 2, 120, '🎉 سردار عرب شکست خورد!', '#ffdd44', 34);
                                createParticles(e.x + e.w / 2, e.y + e.h / 2, '#ff8800', 50, 8, 40);
                                screenShake = 20;
                                score += 50;
                                // Heal player a bit
                                player.hp = Math.min(player.maxHp, player.hp + 20);
                                addFloatingText(player.x, player.y - 30, '+20 ❤️', '#ff4444');
                            }
                        }
                    }
                }
                if (hitCount > 0) {
                    // Combo text
                    if (player.combo >= 2) {
                        addFloatingText(player.x, player.y - 50, `${player.combo}x کومبو!`, '#ffaa44', 26);
                    }
                }

                // Visual effect
                createParticles(cx + player.facing * 30, cy, '#ffaa44', 6, 3, 10);
            }

            // ================================================================
            // 15. Update
            // ================================================================
            function update(dt) {
                if (state !== STATE.PLAYING) return;
                const cappedDt = Math.min(dt, 0.05);
                gameTime++;

                // ---- Player cooldowns ----
                if (player.attackCooldown > 0) player.attackCooldown--;
                if (player.attackTimer > 0) {
                    player.attackTimer--;
                    if (player.attackTimer === 0) player.isAttacking = false;
                }
                if (player.shieldCooldown > 0) player.shieldCooldown--;
                if (player.hitCooldown > 0) player.hitCooldown--;
                if (player.comboCooldown > 0) {
                    player.comboCooldown--;
                    if (player.comboCooldown === 0) player.combo = 0;
                }
                player.walkCycle += 0.06 * (cappedDt * 60);

                // ---- Shield ----
                player.shield = keysK && player.shieldCooldown <= 0 && !player.isAttacking;
                if (player.shield) {
                    // Reduce speed when shielding
                }

                // ---- Attack ----
                if (keysJ && !player.isAttacking && player.attackCooldown === 0) {
                    playerAttack();
                }

                // ---- Movement ----
                let dx = 0,
                    dy = 0;
                if (keys.a) dx = -1;
                if (keys.d) dx = 1;
                if (keys.w && player.grounded) {
                    player.jump = true;
                    player.jumpVel = -7;
                    player.grounded = false;
                }
                if (keys.s) dy = 1;

                if (dx !== 0 && dy !== 0) { dx *= 0.707;
                    dy *= 0.707; }
                if (player.isAttacking) {
                    dx *= 0.3;
                }

                if (player.shield) {
                    dx *= 0.5;
                    dy *= 0.5;
                }

                const speed = player.speed * (keys.shift ? player.sprintMultiplier : 1);
                const newX = player.x + dx * speed * cappedDt;
                const newY = player.y + dy * speed * cappedDt;
                player.x = clamp(newX, 10, W - player.w - 10);
                player.y = clamp(newY, 10, H - player.h - 10);

                // Jump physics
                if (!player.grounded) {
                    player.jumpVel += 0.35 * (cappedDt * 60);
                    player.y += player.jumpVel * (cappedDt * 60);
                    if (player.y >= 350) {
                        player.y = 350;
                        player.jumpVel = 0;
                        player.grounded = true;
                        player.jump = false;
                    }
                }

                // Facing
                if (dx !== 0) player.facing = dx;

                // ---- Enemy AI ----
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    if (e.dead) continue;

                    if (e.stunTimer > 0) {
                        e.stunTimer--;
                        if (e.stunTimer === 0) e.state = 'chase';
                        continue;
                    }
                    if (e.attackCooldown > 0) e.attackCooldown--;

                    const cx = player.x + player.w / 2;
                    const cy = player.y + player.h / 2;
                    const ex = e.x + e.w / 2;
                    const ey = e.y + e.h / 2;
                    const d = dist({ x: ex, y: ey }, { x: cx, y: cy });

                    // Facing
                    e.facing = cx > ex ? 1 : -1;

                    // State: chase or attack
                    if (d < 70 && e.attackCooldown === 0) {
                        // Attack player
                        if (!player.shield) {
                            const dmg = e.damage * (0.8 + Math.random() * 0.4);
                            player.hp -= dmg;
                            player.hitCooldown = 20;
                            screenShake = Math.max(screenShake, 8);
                            createParticles(player.x + player.w / 2, player.y + player.h / 2, '#ff2222', 15, 4, 20);
                            addFloatingText(player.x, player.y - 20, `-${Math.round(dmg)}`, '#ff2222');
                            // Push back
                            const pushDir = e.facing;
                            player.x += pushDir * 25;
                            e.attackCooldown = 40;
                            if (player.hp <= 0) {
                                state = STATE.GAMEOVER;
                                overlay.classList.add('visible');
                                overlay.querySelector('h1').textContent = '💀 بابک شهید شد';
                                overlay.querySelector('.sub').textContent = 'قیام ادامه خواهد یافت...';
                                overlay.querySelector('.desc').textContent = `امتیاز: ${score} | کشته‌ها: ${kills} | مرحله: ${level}`;
                                document.querySelector('#startBtn').textContent = '🔄 نبرد دوباره';
                                updateHUD();
                                return;
                            }
                        } else {
                            // Blocked
                            createParticles(e.x + e.w / 2, e.y + e.h / 2, '#88aaff', 6, 2, 10);
                            e.stunTimer = 10;
                            e.attackCooldown = 30;
                        }
                    } else if (d < 300 && d > 70) {
                        // Chase
                        const spd = e.speed * (1 + gameTime / 200000);
                        const mx = ((cx - ex) / d) * spd * (cappedDt * 60);
                        const my = ((cy - ey) / d) * spd * (cappedDt * 60);
                        e.x += mx;
                        e.y += my;
                        e.x = clamp(e.x, 10, W - e.w - 10);
                        e.y = clamp(e.y, 10, H - e.h - 10);
                        e.walkCycle += 0.04 * (cappedDt * 60);
                    } else {
                        // Patrol
                        e.patrolTimer += 0.02 * (cappedDt * 60);
                        e.x += Math.sin(e.patrolTimer) * 0.6 * (cappedDt * 60);
                        e.y += Math.cos(e.patrolTimer * 0.7) * 0.4 * (cappedDt * 60);
                        e.x = clamp(e.x, 20, W - e.w - 20);
                        e.y = clamp(e.y, 20, H - e.h - 20);
                    }

                    // Boss rage
                    if (e.isBoss && e.hp / e.maxHp < e.rageThreshold && !e.rageMode) {
                        e.rageMode = true;
                        e.speed *= 1.5;
                        e.damage *= 1.3;
                        e.color = '#ff6633';
                        addFloatingText(e.x + e.w / 2, e.y - 20, '🔥 خشم سردار!', '#ff4422', 24);
                        createParticles(e.x + e.w / 2, e.y + e.h / 2, '#ff4422', 20, 5, 20);
                    }

                    // Archer shoots
                    if (e.weapon === 'bow' && d > 150 && d < 400 && e.attackCooldown === 0 && Math.random() < 0.02 * (cappedDt *
                            60)) {
                        spawnProjectile(e.x + e.w / 2, e.y + e.h / 2, cx, cy, e.damage * 0.6);
                        e.attackCooldown = 50;
                    }
                }

                // ---- Projectiles ----
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    const p = projectiles[i];
                    p.x += p.vx * (cappedDt * 60);
                    p.y += p.vy * (cappedDt * 60);
                    p.life--;
                    if (p.life <= 0 || p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) {
                        projectiles.splice(i, 1);
                        continue;
                    }
                    // Check hit player
                    if (p.x > player.x && p.x < player.x + player.w &&
                        p.y > player.y && p.y < player.y + player.h) {
                        if (!player.shield) {
                            player.hp -= p.damage;
                            player.hitCooldown = 15;
                            screenShake = Math.max(screenShake, 5);
                            createParticles(player.x + player.w / 2, player.y + player.h / 2, '#ff2222', 12, 4, 15);
                            addFloatingText(player.x, player.y - 20, `-${Math.round(p.damage)}`, '#ff2222');
                            if (player.hp <= 0) {
                                state = STATE.GAMEOVER;
                                overlay.classList.add('visible');
                                overlay.querySelector('h1').textContent = '💀 بابک شهید شد';
                                overlay.querySelector('.sub').textContent = 'قیام ادامه خواهد یافت...';
                                overlay.querySelector('.desc').textContent =
                                    `امتیاز: ${score} | کشته‌ها: ${kills} | مرحله: ${level}`;
                                document.querySelector('#startBtn').textContent = '🔄 نبرد دوباره';
                                updateHUD();
                                return;
                            }
                        } else {
                            createParticles(p.x, p.y, '#88aaff', 8, 3, 10);
                        }
                        projectiles.splice(i, 1);
                        updateHUD();
                        continue;
                    }
                    // Trail particles
                    if (gameTime % 2 === 0) {
                        createParticles(p.x, p.y, '#ff8844', 2, 1, 8);
                    }
                }

                // ---- Spawn enemies ----
                const alive = enemies.filter(e => !e.dead).length;
                const needMore = levelEnemyCount - enemiesSpawned;
                if (needMore > 0 && alive < 2 + Math.floor(level / 2)) {
                    enemySpawnTimer += cappedDt * 60;
                    if (enemySpawnTimer > 60) {
                        enemySpawnTimer = 0;
                        if (Math.random() < 0.15) spawnEnemy(null);
                    }
                }

                // ---- Boss check ----
                if (!bossActive && !bossDefeated && enemiesSpawned >= levelEnemyCount) {
                    const alive2 = enemies.filter(e => !e.dead).length;
                    if (alive2 === 0) {
                        if (level % 4 === 0) {
                            spawnBoss();
                        } else {
                            level++;
                            addFloatingText(W / 2, 100, `✅ مرحله ${level-1} پیروزی!`, '#44ff88', 30);
                            setTimeout(() => startLevel(), 1500);
                            updateHUD();
                        }
                    }
                }
                if (bossDefeated && !bossActive) {
                    const alive2 = enemies.filter(e => !e.dead).length;
                    if (alive2 === 0) {
                        level++;
                        addFloatingText(W / 2, 100, `🎉 مرحله ${level-1} با پیروزی بر سردار!`, '#ffdd44', 30);
                        setTimeout(() => startLevel(), 2000);
                        bossDefeated = false;
                        updateHUD();
                    }
                }

                // ---- Particles ----
                for (let i = activeParticles.length - 1; i >= 0; i--) {
                    const p = activeParticles[i];
                    p.x += p.vx * (cappedDt * 60);
                    p.y += p.vy * (cappedDt * 60);
                    p.vy += 0.03 * (cappedDt * 60);
                    p.life--;
                    p.size *= 0.98;
                    if (p.life <= 0 || p.size < 0.3) {
                        p.active = false;
                        particlePool.release(p);
                        activeParticles.splice(i, 1);
                    }
                }
                for (let i = activeFloats.length - 1; i >= 0; i--) {
                    const f = activeFloats[i];
                    f.y += f.vy * (cappedDt * 60);
                    f.life--;
                    f.vy *= 0.98;
                    if (f.life <= 0) {
                        f.active = false;
                        floatPool.release(f);
                        activeFloats.splice(i, 1);
                    }
                }

                if (screenShake > 0) screenShake *= 0.92;
                if (screenShake < 0.1) screenShake = 0;
                updateHUD();
            }

            // ================================================================
            // 16. Draw
            // ================================================================
            function draw() {
                ctx.save();

                if (screenShake > 0.5) {
                    ctx.translate((Math.random() - 0.5) * screenShake * 1.6, (Math.random() - 0.5) * screenShake * 1.6);
                }

                // ---- Background ----
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, '#1a0808');
                grad.addColorStop(0.4, '#2a1210');
                grad.addColorStop(0.7, '#1a0e0a');
                grad.addColorStop(1, '#0d0606');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // Desert ground
                ctx.fillStyle = '#3a2820';
                ctx.fillRect(0, H - 60, W, 60);
                ctx.fillStyle = '#4a3830';
                ctx.fillRect(0, H - 55, W, 10);
                ctx.strokeStyle = 'rgba(100,70,50,0.15)';
                ctx.lineWidth = 1;
                for (let i = 0; i < W; i += 30) {
                    ctx.beginPath();
                    ctx.moveTo(i, H - 60);
                    ctx.lineTo(i + 10, H - 50);
                    ctx.stroke();
                }

                // Sun / moon
                ctx.fillStyle = 'rgba(200,150,80,0.06)';
                ctx.beginPath();
                ctx.arc(850, 80, 100, 0, Math.PI * 2);
                ctx.fill();

                // Dust particles
                for (let i = 0; i < 12; i++) {
                    const x = (i * 97 + gameTime * 0.03) % W;
                    const y = H - 40 + Math.sin(gameTime * 0.01 + i) * 15;
                    ctx.fillStyle = `rgba(180,140,100,${0.04 + Math.sin(gameTime*0.02+i)*0.02})`;
                    ctx.beginPath();
                    ctx.arc(x, y, 2 + Math.sin(gameTime * 0.03 + i) * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                // ---- Projectiles ----
                for (let p of projectiles) {
                    ctx.shadowColor = '#ff8844';
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // ---- Enemies (Arabs) ----
                for (let e of enemies) {
                    if (e.dead) continue;
                    const cx = e.x + e.w / 2,
                        cy = e.y + e.h / 2,
                        size = e.w / 2;

                    // Body
                    ctx.shadowColor = e.isBoss ? '#ff6633' : '#8a6a4a';
                    ctx.shadowBlur = e.isBoss ? 30 : 12;
                    const grad2 = ctx.createRadialGradient(
                        cx - size * 0.2, cy - size * 0.2, size * 0.1,
                        cx, cy, size
                    );
                    grad2.addColorStop(0, e.colorLight || e.color);
                    grad2.addColorStop(0.6, e.color);
                    grad2.addColorStop(1, e.colorDark || '#4a2a1a');
                    ctx.fillStyle = grad2;
                    ctx.beginPath();
                    ctx.arc(cx, cy, size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Turban (white arab headdress)
                    ctx.fillStyle = '#f0ead8';
                    ctx.beginPath();
                    ctx.ellipse(cx, cy - size * 0.6, size * 0.8, size * 0.4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#d4c8b0';
                    ctx.beginPath();
                    ctx.ellipse(cx + size * 0.2, cy - size * 0.7, size * 0.3, size * 0.2, 0.3, 0, Math.PI * 2);
                    ctx.fill();

                    // Eyes
                    const eyeOff = e.facing === 1 ? 1 : -1;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.ellipse(cx - size * 0.25 + eyeOff * 2, cy - size * 0.15, size * 0.2, size * 0.25, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(cx + size * 0.25 + eyeOff * 2, cy - size * 0.15, size * 0.2, size * 0.25, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#1a1a2a';
                    ctx.beginPath();
                    ctx.arc(cx - size * 0.2 + eyeOff * 4, cy - size * 0.1, size * 0.1, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + size * 0.3 + eyeOff * 4, cy - size * 0.1, size * 0.1, 0, Math.PI * 2);
                    ctx.fill();

                    // Weapon
                    ctx.strokeStyle = '#8a7a5a';
                    ctx.lineWidth = 3;
                    if (e.weapon === 'spear') {
                        ctx.beginPath();
                        ctx.moveTo(cx + e.facing * size * 0.8, cy - size * 0.2);
                        ctx.lineTo(cx + e.facing * size * 1.8, cy + size * 0.1);
                        ctx.stroke();
                        ctx.fillStyle = '#aabbcc';
                        ctx.beginPath();
                        ctx.moveTo(cx + e.facing * size * 1.7, cy + size * 0.05);
                        ctx.lineTo(cx + e.facing * size * 1.9, cy + size * 0.15);
                        ctx.lineTo(cx + e.facing * size * 1.7, cy + size * 0.25);
                        ctx.fill();
                    } else if (e.weapon === 'sword') {
                        ctx.beginPath();
                        ctx.moveTo(cx + e.facing * size * 0.7, cy - size * 0.1);
                        ctx.lineTo(cx + e.facing * size * 1.4, cy - size * 0.6);
                        ctx.stroke();
                        ctx.fillStyle = '#ccddee';
                        ctx.fillRect(cx + e.facing * size * 1.3, cy - size * 0.65, 6, 10);
                    } else if (e.weapon === 'bow') {
                        ctx.beginPath();
                        ctx.arc(cx + e.facing * size * 0.4, cy - size * 0.2, size * 0.5, -0.8, 0.8);
                        ctx.stroke();
                        ctx.strokeStyle = '#aa8866';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(cx + e.facing * size * 0.7, cy - size * 0.5);
                        ctx.lineTo(cx + e.facing * size * 1.2, cy + size * 0.2);
                        ctx.stroke();
                    }

                    // Boss crown
                    if (e.isBoss) {
                        ctx.fillStyle = '#ffcc44';
                        ctx.shadowColor = '#ffcc44';
                        ctx.shadowBlur = 20;
                        ctx.font = '24px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('👑', cx, cy - size - 10);
                        ctx.shadowBlur = 0;
                        // Boss aura
                        ctx.strokeStyle = `rgba(255,68,34,${0.15 + Math.sin(gameTime*0.05)*0.05})`;
                        ctx.lineWidth = 3;
                        ctx.setLineDash([6, 8]);
                        ctx.beginPath();
                        ctx.arc(cx, cy, size + 8, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.setLineDash([]);
                        if (e.rageMode) {
                            ctx.fillStyle = 'rgba(255,50,20,0.08)';
                            ctx.beginPath();
                            ctx.arc(cx, cy, size + 18, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }

                    // HP bar
                    if (e.hp < e.maxHp || e.isBoss) {
                        const bw = e.isBoss ? size * 1.8 : size * 1.2;
                        const bh = e.isBoss ? 6 : 4;
                        const by = cy - size - (e.isBoss ? 30 : 12);
                        ctx.fillStyle = 'rgba(0,0,0,0.7)';
                        ctx.fillRect(cx - bw / 2, by, bw, bh);
                        const hpRatio = e.hp / e.maxHp;
                        ctx.fillStyle = hpRatio > 0.3 ? '#44cc66' : '#ff3333';
                        ctx.fillRect(cx - bw / 2, by, bw * Math.max(0, hpRatio), bh);
                    }

                    // Stun effect
                    if (e.stunTimer > 0) {
                        ctx.strokeStyle = `rgba(255,255,200,${0.3 + Math.sin(gameTime*0.2)*0.2})`;
                        ctx.lineWidth = 2;
                        ctx.setLineDash([4, 6]);
                        ctx.beginPath();
                        ctx.arc(cx, cy, size + 4, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                }

                // ---- Player (Babak Khorramdin) ----
                const px = player.x,
                    py = player.y;
                const cx2 = px + player.w / 2,
                    cy2 = py + player.h / 2;

                // Shadow
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 15;
                ctx.shadowOffsetY = 4;

                // Body (red khamegan - لباس سرخ جامگان)
                ctx.shadowBlur = 10;
                // Red robe
                const robeGrad = ctx.createLinearGradient(px, py, px + player.w, py + player.h);
                robeGrad.addColorStop(0, '#cc2222');
                robeGrad.addColorStop(0.3, '#aa1a1a');
                robeGrad.addColorStop(0.6, '#881515');
                robeGrad.addColorStop(1, '#661010');
                ctx.fillStyle = robeGrad;
                ctx.beginPath();
                ctx.roundRect(px + 2, py + 8, player.w - 4, player.h - 12, 4);
                ctx.fill();

                // Red cape
                ctx.fillStyle = '#991111';
                ctx.beginPath();
                ctx.moveTo(px + 2, py + 10);
                ctx.quadraticCurveTo(px - 12, py + 20, px - 6, py + 40);
                ctx.lineTo(px + 4, py + 30);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(px + player.w - 2, py + 10);
                ctx.quadraticCurveTo(px + player.w + 12, py + 20, px + player.w + 6, py + 40);
                ctx.lineTo(px + player.w - 4, py + 30);
                ctx.fill();

                // Belt
                ctx.fillStyle = '#8a6a3a';
                ctx.fillRect(px + 4, py + 24, player.w - 8, 4);
                ctx.fillStyle = '#ccaa44';
                ctx.fillRect(px + player.w / 2 - 4, py + 22, 8, 8);

                // Head
                ctx.shadowBlur = 8;
                ctx.fillStyle = '#e8c8a0';
                ctx.beginPath();
                ctx.arc(cx2, py + 8, 13, 0, Math.PI * 2);
                ctx.fill();

                // Hair (long persian hair)
                ctx.fillStyle = '#2a1a0a';
                ctx.beginPath();
                ctx.ellipse(cx2 - 4, py + 2, 4, 8, -0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(cx2 + 4, py + 2, 4, 8, 0.2, 0, Math.PI * 2);
                ctx.fill();

                // Beard
                ctx.fillStyle = '#2a1a0a';
                ctx.beginPath();
                ctx.ellipse(cx2, py + 14, 8, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                const eyeOffX = player.facing === 1 ? 1 : -1;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(cx2 - 4 + eyeOffX, py + 6, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(cx2 + 4 + eyeOffX, py + 6, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1a1a2a';
                ctx.beginPath();
                ctx.arc(cx2 - 3 + eyeOffX * 1.5, py + 7, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(cx2 + 5 + eyeOffX * 1.5, py + 7, 2, 0, Math.PI * 2);
                ctx.fill();

                // Crown / headband
                ctx.fillStyle = '#ccaa44';
                ctx.shadowColor = '#ccaa44';
                ctx.shadowBlur = 10;
                ctx.fillRect(cx2 - 10, py - 2, 20, 3);
                ctx.fillStyle = '#ffdd66';
                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('✦', cx2, py - 1);
                ctx.shadowBlur = 0;

                // Sword
                ctx.shadowBlur = 6;
                ctx.strokeStyle = '#c0d0e0';
                ctx.lineWidth = 3;
                const swordX = px + player.w + (player.isAttacking ? 20 : 2);
                const swordY = py + 14 + (player.isAttacking ? -10 : 0);
                ctx.beginPath();
                ctx.moveTo(swordX, swordY);
                ctx.lineTo(swordX + 28, swordY - 16);
                ctx.stroke();
                ctx.fillStyle = '#ddeeff';
                ctx.fillRect(swordX + 24, swordY - 18, 5, 8);
                // Handle
                ctx.fillStyle = '#8a6a3a';
                ctx.fillRect(swordX - 2, swordY - 2, 6, 6);

                // Shield (if active)
                if (player.shield) {
                    ctx.shadowColor = '#88aaff';
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = 'rgba(80,130,200,0.3)';
                    ctx.beginPath();
                    ctx.arc(player.facing === 1 ? px + player.w + 6 : px - 6, py + 18, 16, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(80,130,200,0.5)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(player.facing === 1 ? px + player.w + 6 : px - 6, py + 18, 16, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;

                // ---- Particles ----
                for (let p of activeParticles) {
                    const alpha = p.life / (p.maxLife || 20);
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 12 * alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, Math.max(0.5, p.size * alpha), 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;

                // ---- Floating texts ----
                for (let f of activeFloats) {
                    const alpha = f.life / f.maxLife;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = f.color;
                    ctx.font = `bold ${f.size}px "Segoe UI", sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = f.color;
                    ctx.shadowBlur = 20 * alpha;
                    ctx.fillText(f.text, f.x, f.y);
                    ctx.shadowBlur = 0;
                }
                ctx.globalAlpha = 1;

                // ---- Mini HUD on canvas ----
                ctx.fillStyle = 'rgba(255,200,150,0.08)';
                ctx.font = '12px "Segoe UI", sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillText(`⏱ ${Math.floor(gameTime/60)}s`, 15, H - 15);
                ctx.textAlign = 'right';
                ctx.fillText(`👥 ${enemies.filter(e=>!e.dead).length}`, W - 15, H - 15);

                ctx.restore();
            }

            // ================================================================
            // 17. HUD Update
            // ================================================================
            function updateHUD() {
                hpDisplay.textContent = Math.max(0, Math.round(player.hp));
                killDisplay.textContent = kills;
                scoreDisplay.textContent = score;
                levelDisplay.textContent = level;
            }

            // ================================================================
            // 18. Game Loop
            // ================================================================
            function gameLoop(timestamp) {
                if (!lastTimestamp) lastTimestamp = timestamp;
                const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.05);
                lastTimestamp = timestamp;

                if (state === STATE.MENU) {
                    gameTime++;
                    draw();
                    requestAnimationFrame(gameLoop);
                    return;
                }

                update(dt);
                draw();
                requestAnimationFrame(gameLoop);
            }

            // ================================================================
            // 19. RoundRect polyfill
            // ================================================================
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (r > w / 2) r = w / 2;
                    if (r > h / 2) r = h / 2;
                    this.moveTo(x + r, y);
                    this.lineTo(x + w - r, y);
                    this.quadraticCurveTo(x + w, y, x + w, y + r);
                    this.lineTo(x + w, y + h - r);
                    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    this.lineTo(x + r, y + h);
                    this.quadraticCurveTo(x, y + h, x, y + h - r);
                    this.lineTo(x, y + r);
                    this.quadraticCurveTo(x, y, x + r, y);
                    this.closePath();
                    return this;
                };
            }

            // ================================================================
            // 20. Start
            // ================================================================
            state = STATE.MENU;
            overlay.classList.add('visible');
            overlay.querySelector('h1').textContent = '⚔️ بابک خرمدین';
            overlay.querySelector('.sub').textContent = 'قیام سرخ جامگان';
            overlay.querySelector('.desc').textContent = 'مبارزه با ستمگران عرب در راه آزادی ایران';
            document.querySelector('#startBtn').textContent = '▶ آغاز نبرد';
            gameLoop(0);

            console.log('⚔️ بابک خرمدین - قیام سرخ');
            console.log('🕹️ WASD حرکت | J حمله | K سپر | Shift دویدن | Space پرش');

            window.addEventListener('beforeunload', () => {
                particlePool.clear();
                floatPool.clear();
            });

        })();
    </script>

</body>
