<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🎮 DOOM 3 × Poppy Playtime</title>
    
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        ::-webkit-scrollbar-thumb { background: #e94560; border-radius: 10px; }
        
        /* ===== HEADER ===== */
        .header {
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
        }
        .logo span { color: #e94560; }
        .logo small {
            font-size: 12px;
            font-weight: 400;
            color: #888;
            display: none;
        }
        @media (min-width: 600px) { .logo small { display: inline; } }
        
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 8px 18px;
            border-radius: 30px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.02); }
        .btn-primary {
            background: linear-gradient(135deg, #e94560, #c23152);
            color: #fff;
        }
        .btn-primary:hover { background: linear-gradient(135deg, #ff5a7a, #e94560); box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4); }
        .btn-outline { border: 1px solid rgba(255, 255, 255, 0.2); background: transparent; }
        
        /* ===== GAME CONTAINER ===== */
        .game-container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 16px;
        }
        
        .game-wrapper {
            background: #12121e;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            position: relative;
        }
        
        .game-header {
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .game-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .game-title h2 {
            font-size: 18px;
            font-weight: 700;
        }
        .game-title .badge {
            background: rgba(233, 69, 96, 0.2);
            color: #e94560;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .game-stats {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: #888;
        }
        .game-stats span { display: flex; align-items: center; gap: 4px; }
        .game-stats .num { color: #fff; font-weight: 600; }
        
        /* ===== CANVAS ===== */
        .canvas-wrap {
            position: relative;
            background: #0a0a15;
            touch-action: none;
        }
        .canvas-wrap canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1000/650;
            touch-action: none;
            outline: none;
            cursor: crosshair;
        }
        
        /* ===== GAME OVERLAY ===== */
        .game-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
            z-index: 10;
            border-radius: 0 0 24px 24px;
        }
        .game-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }
        .game-overlay h1 {
            font-size: clamp(32px, 6vw, 56px);
            font-weight: 800;
            margin-bottom: 8px;
        }
        .game-overlay p {
            color: #aaa;
            font-size: clamp(14px, 2vw, 20px);
            margin-bottom: 20px;
        }
        .game-overlay .btn {
            font-size: 18px;
            padding: 14px 40px;
        }
        
        /* ===== TOUCH CONTROLS ===== */
        .touch-controls {
            display: none;
            padding: 12px 16px 16px;
            background: rgba(0, 0, 0, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            touch-action: none;
        }
        
        @media (pointer: coarse) {
            .touch-controls { display: flex; }
        }
        
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 52px);
            grid-template-rows: repeat(3, 52px);
            gap: 4px;
            flex-shrink: 0;
        }
        .dpad button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            color: #fff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            transition: background 0.08s;
            cursor: pointer;
            width: 100%;
            height: 100%;
            padding: 0;
        }
        .dpad button:active { background: rgba(255, 255, 255, 0.25); }
        .dpad .empty { background: transparent; border: none; pointer-events: none; }
        
        .action-btns {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .action-btns button {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            transition: background 0.08s;
            cursor: pointer;
        }
        .action-btns button:active { background: rgba(255, 255, 255, 0.25); }
        .action-btns .fire { background: rgba(233, 69, 96, 0.3); border-color: #e94560; }
        .action-btns .fire:active { background: rgba(233, 69, 96, 0.6); }
        
        /* ===== HUD ===== */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.7);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
            gap: 4px 12px;
            font-size: 13px;
        }
        .hud-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #aaa;
        }
        .hud-item .val {
            color: #fff;
            font-weight: 700;
            min-width: 20px;
        }
        .hud-item .val.hp { color: #ff4757; }
        .hud-item .val.gold { color: #ffd93d; }
        
        /* ===== FOOTER ===== */
        .footer {
            max-width: 1100px;
            margin: 30px auto 20px;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            color: #555;
            font-size: 13px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
        }
        .footer a {
            color: #888;
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer a:hover { color: #fff; }
        .footer .links { display: flex; gap: 20px; flex-wrap: wrap; }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .header { padding: 10px 16px; }
            .logo { font-size: 16px; }
            .btn { font-size: 12px; padding: 6px 14px; }
            .game-header { padding: 12px 16px; }
            .game-title h2 { font-size: 15px; }
            .game-stats { font-size: 11px; gap: 10px; }
            .hud { font-size: 11px; padding: 8px 14px; }
            .dpad { grid-template-columns: repeat(3, 42px); grid-template-rows: repeat(3, 42px); }
            .action-btns button { width: 46px; height: 46px; font-size: 18px; }
        }
        @media (max-width: 400px) {
            .dpad { grid-template-columns: repeat(3, 36px); grid-template-rows: repeat(3, 36px); gap: 3px; }
            .action-btns button { width: 40px; height: 40px; font-size: 15px; }
            .hud { font-size: 10px; padding: 6px 10px; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <a href="#" class="logo">
            🎮 <span>DOOM</span>3 × Poppy
            <small>— بازی آنلاین</small>
        </a>
        <div class="header-actions">
            <button class="btn btn-outline">⭐ امتیاز</button>
            <button class="btn btn-primary">▶ بازی کن</button>
            <button class="btn btn-outline">👤 ورود</button>
        </div>
    </header>

    <!-- ===== GAME ===== -->
    <main class="game-container">
        <div class="game-wrapper">
            <!-- Game Header -->
            <div class="game-header">
                <div class="game-title">
                    <h2>🔦 DOOM 3 × Poppy Playtime</h2>
                    <span class="badge">🔥 محبوب</span>
                </div>
                <div class="game-stats">
                    <span>👾 <span class="num" id="enemyDisplayHeader">0</span></span>
                    <span>⭐ <span class="num" id="scoreDisplayHeader">0</span></span>
                    <span>📊 <span class="num" id="levelDisplayHeader">1</span></span>
                    <span>🏆 <span class="num" id="killDisplayHeader">0</span></span>
                </div>
            </div>

            <!-- Canvas -->
            <div class="canvas-wrap">
                <canvas id="gameCanvas" width="1000" height="650" tabindex="0"></canvas>
                
                <!-- Overlay (Menu / Game Over) -->
                <div class="game-overlay visible" id="gameOverlay">
                    <h1 id="overlayTitle">🎮 DOOM 3 × Poppy</h1>
                    <p id="overlayDesc">هاگی واگی در تاریکی کمین کرده...</p>
                    <button class="btn btn-primary" id="overlayBtn">▶ شروع بازی</button>
                </div>
            </div>

            <!-- Touch Controls -->
            <div class="touch-controls" id="touchControls">
                <div class="dpad">
                    <div class="empty"></div>
                    <button data-key="w" aria-label="بالا">▲</button>
                    <div class="empty"></div>
                    <button data-key="a" aria-label="چپ">◀</button>
                    <button data-key="s" aria-label="پایین">▼</button>
                    <button data-key="d" aria-label="راست">▶</button>
                    <div class="empty"></div>
                    <button data-key="shift" aria-label="دویدن">⚡</button>
                    <div class="empty"></div>
                </div>
                <div class="action-btns">
                    <button class="fire" data-key="space" aria-label="شلیک">🔫</button>
                    <button data-key="r" aria-label="بارگذاری">🔄</button>
                    <button data-key="f" aria-label="چراغ قوه">💡</button>
                </div>
            </div>

            <!-- HUD -->
            <div class="hud" role="status" aria-live="polite">
                <span class="hud-item">❤️ <span class="val hp" id="hpDisplay">100</span></span>
                <span class="hud-item">🔫 <span class="val" id="ammoDisplay">12</span></span>
                <span class="hud-item">💡 <span class="val" id="lightDisplay">🌑</span></span>
                <span class="hud-item">👾 <span class="val" id="enemyDisplay">0</span></span>
                <span class="hud-item">⭐ <span class="val gold" id="scoreDisplay">0</span></span>
                <span class="hud-item">📊 <span class="val" id="levelDisplay">1</span></span>
                <span class="hud-item">🏆 <span class="val gold" id="killDisplay">0</span></span>
            </div>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <span>© 2026 DOOM3 × Poppy — ساخته شده با ❤️</span>
        <div class="links">
            <a href="#">درباره</a>
            <a href="#">قوانین</a>
            <a href="#">تماس</a>
            <a href="#">گیت‌هاب</a>
        </div>
    </footer>

    <!-- ================================================================
    اسکریپت کامل بازی
    ================================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // 1. تنظیمات
            // ============================================================
            const W = 1000, H = 650;
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            // DOM elements
            const hpSpan = document.getElementById('hpDisplay');
            const ammoSpan = document.getElementById('ammoDisplay');
            const lightSpan = document.getElementById('lightDisplay');
            const enemySpan = document.getElementById('enemyDisplay');
            const scoreSpan = document.getElementById('scoreDisplay');
            const levelSpan = document.getElementById('levelDisplay');
            const killSpan = document.getElementById('killDisplay');
            
            const enemyHeader = document.getElementById('enemyDisplayHeader');
            const scoreHeader = document.getElementById('scoreDisplayHeader');
            const levelHeader = document.getElementById('levelDisplayHeader');
            const killHeader = document.getElementById('killDisplayHeader');

            const overlay = document.getElementById('gameOverlay');
            const overlayTitle = document.getElementById('overlayTitle');
            const overlayDesc = document.getElementById('overlayDesc');
            const overlayBtn = document.getElementById('overlayBtn');

            // ============================================================
            // 2. State
            // ============================================================
            const STATE = { MENU: 'MENU', PLAYING: 'PLAYING', GAMEOVER: 'GAMEOVER' };
            let state = STATE.MENU;
            let score = 0, kills = 0, level = 1;
            let gameTime = 0, screenShake = 0;
            let levelEnemyCount = 0, enemiesSpawned = 0;
            let bossActive = false, bossDefeated = false;
            let lastTimestamp = 0;

            // ============================================================
            // 3. Player
            // ============================================================
            const player = {
                x: 500, y: 325, w: 32, h: 38,
                speed: 180,
                sprintMultiplier: 1.6,
                hp: 100, maxHp: 100,
                ammo: 12, maxAmmo: 12,
                flashlight: false,
                angle: 0,
                shootCooldown: 0,
                reloading: false,
                reloadTimer: 0,
                damageCooldown: 0,
                weaponBob: 0
            };

            // ============================================================
            // 4. Enemy Types
            // ============================================================
            const ENEMY_TYPES = {
                huggy: {
                    name: 'هاگی واگی', color: '#42A5F5', colorDark: '#1A237E',
                    colorLight: '#90CAF9', hp: 30, speed: 1.2, size: 30,
                    score: 50, damage: 15, eyeColor: '#FF1744', mouthColor: '#1A237E'
                },
                kissy: {
                    name: 'کیسی میسی', color: '#FF8A80', colorDark: '#C62828',
                    colorLight: '#FFCDD2', hp: 22, speed: 1.8, size: 26,
                    score: 40, damage: 12, eyeColor: '#FF1744', mouthColor: '#C62828'
                },
                poppy: {
                    name: 'پاپی', color: '#FFD740', colorDark: '#F57F17',
                    colorLight: '#FFF9C4', hp: 18, speed: 1.0, size: 22,
                    score: 30, damage: 8, eyeColor: '#FF1744', mouthColor: '#F57F17'
                }
            };

            const BOSS_TYPES = {
                huggy_boss: {
                    name: '👾 هاگی غول‌پیکر', color: '#1A237E', colorDark: '#0D1442',
                    colorLight: '#536DFE', hp: 120, speed: 1.0, size: 55,
                    score: 200, damage: 25, eyeColor: '#FF1744', mouthColor: '#000',
                    isBoss: true
                },
                kissy_boss: {
                    name: '👾 کیسی غول‌پیکر', color: '#C62828', colorDark: '#7F0000',
                    colorLight: '#FF8A80', hp: 100, speed: 1.3, size: 48,
                    score: 180, damage: 22, eyeColor: '#FF1744', mouthColor: '#7F0000',
                    isBoss: true
                },
                poppy_boss: {
                    name: '👾 پاپی غول‌پیکر', color: '#F57F17', colorDark: '#A85D00',
                    colorLight: '#FFD740', hp: 80, speed: 0.9, size: 42,
                    score: 150, damage: 18, eyeColor: '#FF1744', mouthColor: '#A85D00',
                    isBoss: true
                }
            };

            // ============================================================
            // 5. Utilities
            // ============================================================
            function rand(min, max) { return Math.random() * (max - min) + min; }
            function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
            function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
            function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
            function rectCollide(a, b) {
                return a.x < b.x + b.w && a.x + a.w > b.x &&
                       a.y < b.y + b.h && a.y + a.h > b.y;
            }

            // ============================================================
            // 6. Object Pool
            // ============================================================
            class ObjectPool {
                constructor(factory, reset, initialSize = 0) {
                    this.factory = factory;
                    this.reset = reset;
                    this.pool = [];
                    for (let i = 0; i < initialSize; i++) this.pool.push(this.factory());
                }
                acquire() {
                    if (this.pool.length > 0) {
                        const obj = this.pool.pop();
                        this.reset(obj);
                        return obj;
                    }
                    return this.factory();
                }
                release(obj) { this.pool.push(obj); }
                clear() { this.pool = []; }
            }

            // ============================================================
            // 7. Pools
            // ============================================================
            function bulletFactory() {
                return { x: 0, y: 0, vx: 0, vy: 0, life: 0, damage: 20, radius: 4, color: '#00ff88', active: false };
            }
            function bulletReset(b) {
                b.x = 0; b.y = 0; b.vx = 0; b.vy = 0; b.life = 0; b.damage = 20; b.radius = 4; b.color = '#00ff88';
                b.active = false;
            }
            const bulletPool = new ObjectPool(bulletFactory, bulletReset, 30);

            function particleFactory() {
                return { x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 30, color: '#fff', size: 4, active: false };
            }
            function particleReset(p) {
                p.x = 0; p.y = 0; p.vx = 0; p.vy = 0; p.life = 0; p.maxLife = 30; p.color = '#fff'; p.size = 4;
                p.active = false;
            }
            const particlePool = new ObjectPool(particleFactory, particleReset, 100);

            function floatFactory() {
                return { x: 0, y: 0, text: '', color: '#fff', size: 20, life: 0, maxLife: 50, vy: -1.2, active: false };
            }
            function floatReset(f) {
                f.x = 0; f.y = 0; f.text = ''; f.color = '#fff'; f.size = 20; f.life = 0; f.maxLife = 50; f.vy = -1.2;
                f.active = false;
            }
            const floatPool = new ObjectPool(floatFactory, floatReset, 20);

            // ============================================================
            // 8. Game Arrays
            // ============================================================
            let enemies = [];
            let ammoPickups = [];
            let healthPickups = [];
            const activeBullets = [];
            const activeParticles = [];
            const activeFloats = [];

            // ============================================================
            // 9. Input (Keyboard + Touch)
            // ============================================================
            const keys = { w: false, a: false, s: false, d: false, shift: false };
            let mouseX = W / 2, mouseY = H / 2;
            let spacePressed = false, fPressed = false, mouseDown = false;
            let reloadRequested = false;

            // Keyboard
            document.addEventListener('keydown', (e) => {
                const key = e.key;
                if (['w', 'W', 'a', 'A', 's', 'S', 'd', 'D', ' ', 'f', 'F', 'r', 'R', 'Shift', 'ArrowUp', 'ArrowDown',
                        'ArrowLeft', 'ArrowRight'
                    ].includes(key)) e.preventDefault();
                if (key === 'w' || key === 'W' || key === 'ArrowUp') keys.w = true;
                if (key === 's' || key === 'S' || key === 'ArrowDown') keys.s = true;
                if (key === 'a' || key === 'A' || key === 'ArrowLeft') keys.a = true;
                if (key === 'd' || key === 'D' || key === 'ArrowRight') keys.d = true;
                if (key === 'Shift') keys.shift = true;
                if (key === ' ') spacePressed = true;
                if (key === 'f' || key === 'F') fPressed = true;
                if (key === 'r' || key === 'R') reloadRequested = true;
                if (key === 'Enter' && state === STATE.MENU) startGame();
                if (key === 'Enter' && state === STATE.GAMEOVER) startGame();
            });

            document.addEventListener('keyup', (e) => {
                const key = e.key;
                if (['w', 'W', 'a', 'A', 's', 'S', 'd', 'D', ' ', 'Shift', 'ArrowUp', 'ArrowDown', 'ArrowLeft',
                        'ArrowRight'
                    ].includes(key)) e.preventDefault();
                if (key === 'w' || key === 'W' || key === 'ArrowUp') keys.w = false;
                if (key === 's' || key === 'S' || key === 'ArrowDown') keys.s = false;
                if (key === 'a' || key === 'A' || key === 'ArrowLeft') keys.a = false;
                if (key === 'd' || key === 'D' || key === 'ArrowRight') keys.d = false;
                if (key === 'Shift') keys.shift = false;
                if (key === ' ') spacePressed = false;
            });

            // Mouse
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const sx = canvas.width / rect.width;
                const sy = canvas.height / rect.height;
                mouseX = (e.clientX - rect.left) * sx;
                mouseY = (e.clientY - rect.top) * sy;
            });

            canvas.addEventListener('mousedown', (e) => {
                e.preventDefault();
                mouseDown = true;
                if (state === STATE.MENU) startGame();
                else if (state === STATE.GAMEOVER) startGame();
            });
            canvas.addEventListener('mouseup', () => mouseDown = false);
            canvas.addEventListener('mouseleave', () => mouseDown = false);

            // Touch on canvas
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                const sx = canvas.width / rect.width;
                const sy = canvas.height / rect.height;
                mouseX = (touch.clientX - rect.left) * sx;
                mouseY = (touch.clientY - rect.top) * sy;
                mouseDown = true;
                if (state === STATE.MENU) startGame();
                else if (state === STATE.GAMEOVER) startGame();
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                const sx = canvas.width / rect.width;
                const sy = canvas.height / rect.height;
                mouseX = (touch.clientX - rect.left) * sx;
                mouseY = (touch.clientY - rect.top) * sy;
            }, { passive: false });

            canvas.addEventListener('touchend', () => mouseDown = false);

            // Touch buttons
            document.querySelectorAll('#touchControls button[data-key]').forEach(btn => {
                const key = btn.dataset.key;
                const start = (e) => {
                    e.preventDefault();
                    if (key === 'w' || key === 'a' || key === 's' || key === 'd' || key === 'shift') {
                        keys[key] = true;
                    }
                    if (key === 'space') spacePressed = true;
                    if (key === 'f') fPressed = true;
                    if (key === 'r') reloadRequested = true;
                };
                const end = (e) => {
                    e.preventDefault();
                    if (key === 'w' || key === 'a' || key === 's' || key === 'd' || key === 'shift') {
                        keys[key] = false;
                    }
                    if (key === 'space') spacePressed = false;
                    if (key === 'f') fPressed = false;
                };
                btn.addEventListener('touchstart', start, { passive: false });
                btn.addEventListener('touchend', end, { passive: false });
                btn.addEventListener('touchcancel', end, { passive: false });
                btn.addEventListener('mousedown', start);
                btn.addEventListener('mouseup', end);
                btn.addEventListener('mouseleave', end);
            });

            // Overlay button
            overlayBtn.addEventListener('click', startGame);
            overlayBtn.addEventListener('touchend', (e) => { e.preventDefault();
                startGame(); });

            // ============================================================
            // 10. Game Functions
            // ============================================================
            function createParticles(x, y, color, count = 12, speed = 5, life = 30) {
                for (let i = 0; i < count; i++) {
                    const p = particlePool.acquire();
                    const angle = rand(0, Math.PI * 2);
                    const spd = rand(1, speed);
                    p.x = x;
                    p.y = y;
                    p.vx = Math.cos(angle) * spd;
                    p.vy = Math.sin(angle) * spd - 0.5;
                    p.life = rand(life * 0.5, life);
                    p.maxLife = life;
                    p.color = color;
                    p.size = rand(2, 6);
                    p.active = true;
                    activeParticles.push(p);
                }
            }

            function addFloatingText(x, y, text, color = '#fff', size = 20) {
                const f = floatPool.acquire();
                f.x = x;
                f.y = y;
                f.text = text;
                f.color = color;
                f.size = size;
                f.life = 50;
                f.maxLife = 50;
                f.vy = -1.2;
                f.active = true;
                activeFloats.push(f);
            }

            function spawnBullet(x, y, angle, speed, damage) {
                const b = bulletPool.acquire();
                b.x = x;
                b.y = y;
                const spread = 0.04;
                const a = angle + rand(-spread, spread);
                b.vx = Math.cos(a) * speed;
                b.vy = Math.sin(a) * speed;
                b.life = 70;
                b.damage = damage;
                b.radius = 4;
                b.color = '#00ff88';
                b.active = true;
                activeBullets.push(b);
            }

            function spawnEnemy(type = null) {
                const side = randInt(0, 3);
                let x, y;
                const pad = 60;
                if (side === 0) { x = -pad;
                    y = rand(0, H); } else if (side === 1) { x = W + pad;
                    y = rand(0, H); } else if (side === 2) { x = rand(0, W);
                    y = -pad; } else { x = rand(0, W);
                    y = H + pad; }

                const types = Object.keys(ENEMY_TYPES);
                const selected = type || types[randInt(0, types.length - 1)];
                const data = ENEMY_TYPES[selected];
                const levelScale = 1 + (level - 1) * 0.12;
                const hpScale = 1 + (level - 1) * 0.08;

                enemies.push({
                    x,
                    y,
                    w: data.size,
                    h: data.size,
                    hp: data.hp * hpScale,
                    maxHp: data.hp * hpScale,
                    speed: data.speed * levelScale * (0.9 + Math.random() * 0.2),
                    type: selected,
                    color: data.color,
                    colorDark: data.colorDark,
                    colorLight: data.colorLight,
                    score: Math.round(data.score * (1 + (level - 1) * 0.05)),
                    damage: data.damage * (1 + (level - 1) * 0.06),
                    eyeColor: data.eyeColor,
                    mouthColor: data.mouthColor,
                    state: 'chase',
                    stunTimer: 0,
                    name: data.name,
                    isBoss: false,
                    dead: false,
                    patrolTimer: rand(0, 100)
                });
                enemiesSpawned++;
            }

            function spawnBoss() {
                const side = randInt(0, 3);
                let x, y;
                const pad = 80;
                if (side === 0) { x = -pad;
                    y = rand(100, H - 100); } else if (side === 1) { x = W + pad;
                    y = rand(100, H - 100); } else if (side === 2) { x = rand(100, W - 100);
                    y = -pad; } else { x = rand(100, W - 100);
                    y = H + pad; }

                const types = Object.keys(BOSS_TYPES);
                const selected = types[randInt(0, types.length - 1)];
                const data = BOSS_TYPES[selected];
                const levelScale = 1 + (level - 1) * 0.08;

                enemies.push({
                    x,
                    y,
                    w: data.size,
                    h: data.size,
                    hp: data.hp * levelScale,
                    maxHp: data.hp * levelScale,
                    speed: data.speed * (0.9 + Math.random() * 0.2),
                    type: selected,
                    color: data.color,
                    colorDark: data.colorDark,
                    colorLight: data.colorLight,
                    score: data.score,
                    damage: data.damage * (1 + (level - 1) * 0.05),
                    eyeColor: data.eyeColor,
                    mouthColor: data.mouthColor,
                    state: 'chase',
                    stunTimer: 0,
                    name: data.name,
                    isBoss: true,
                    dead: false,
                    patrolTimer: 0,
                    rageMode: false,
                    rageThreshold: 0.5
                });
                bossActive = true;
                bossDefeated = false;
                addFloatingText(W / 2, 100, `⚠️ ${data.name} ظاهر شد!`, '#ff1744', 32);
                createParticles(x, y, '#ff1744', 40, 8, 40);
                screenShake = 15;
            }

            function startLevel() {
                levelEnemyCount = 5 + level * 2;
                enemiesSpawned = 0;
                bossActive = false;
                bossDefeated = false;
                enemies = enemies.filter(e => e.dead);

                const initialCount = Math.min(3 + Math.floor(level / 2), 8);
                for (let i = 0; i < initialCount; i++) {
                    setTimeout(() => spawnEnemy(null), i * 300);
                }
                for (let i = 0; i < Math.min(2 + level, 6); i++) {
                    setTimeout(() => {
                        ammoPickups.push({
                            x: rand(50, W - 50),
                            y: rand(50, H - 50),
                            w: 16,
                            h: 16,
                            collected: false,
                            amount: 3 + randInt(0, 3)
                        });
                    }, 500 + i * 200);
                }
                for (let i = 0; i < Math.min(1 + Math.floor(level / 3), 4); i++) {
                    setTimeout(() => {
                        healthPickups.push({
                            x: rand(50, W - 50),
                            y: rand(50, H - 50),
                            w: 16,
                            h: 16,
                            collected: false,
                            amount: 15 + randInt(0, 15)
                        });
                    }, 800 + i * 300);
                }
                addFloatingText(W / 2, 80, `📍 مرحله ${level}`, '#4CAF50', 28);
                updateHUD();
            }

            function startGame() {
                state = STATE.PLAYING;
                score = 0;
                kills = 0;
                level = 1;
                gameTime = 0;
                screenShake = 0;
                player.x = 500;
                player.y = 325;
                player.hp = 100;
                player.ammo = 12;
                player.flashlight = false;
                player.reloading = false;
                player.reloadTimer = 0;
                player.damageCooldown = 0;
                enemies = [];
                activeBullets.length = 0;
                activeParticles.length = 0;
                activeFloats.length = 0;
                ammoPickups = [];
                healthPickups = [];
                bossActive = false;
                bossDefeated = false;
                overlay.classList.remove('visible');
                canvas.focus();
                startLevel();
                updateHUD();
            }

            function shoot() {
                if (state !== STATE.PLAYING) return;
                if (player.reloading) return;
                if (player.shootCooldown > 0) return;
                if (player.ammo <= 0) { startReload(); return; }

                player.ammo--;
                player.shootCooldown = 8;
                screenShake = Math.max(screenShake, 5);
                player.weaponBob = -3;

                const ang = player.angle;
                const cx = player.x + player.w / 2;
                const cy = player.y + player.h / 2;
                const speed = 10 + (level * 0.1);
                const dmg = 20 + Math.floor(level / 3) * 2;

                spawnBullet(cx + Math.cos(ang) * 25, cy + Math.sin(ang) * 25, ang, speed, dmg);
                createParticles(cx + Math.cos(ang) * 25, cy + Math.sin(ang) * 25, '#ffd740', 6, 3, 12);
                createParticles(cx + Math.cos(ang) * 25, cy + Math.sin(ang) * 25, '#ff6f00', 4, 2, 8);
                updateHUD();
            }

            function startReload() {
                if (player.reloading) return;
                if (player.ammo === player.maxAmmo) return;
                player.reloading = true;
                player.reloadTimer = 50;
                addFloatingText(player.x, player.y - 35, '🔄 بارگذاری...', '#0f0');
            }

            function updateHUD() {
                hpSpan.textContent = Math.max(0, Math.round(player.hp));
                ammoSpan.textContent = player.reloading ? '...' : player.ammo;
                lightSpan.textContent = player.flashlight ? '💡' : '🌑';
                lightSpan.style.color = player.flashlight ? '#ffd740' : '#666';
                const alive = enemies.filter(e => !e.dead).length;
                enemySpan.textContent = alive;
                enemyHeader.textContent = alive;
                scoreSpan.textContent = score;
                scoreHeader.textContent = score;
                levelSpan.textContent = level;
                levelHeader.textContent = level;
                killSpan.textContent = kills;
                killHeader.textContent = kills;
            }

            // ============================================================
            // 11. Update
            // ============================================================
            function update(dt) {
                if (state !== STATE.PLAYING) return;
                const cappedDt = Math.min(dt, 0.05);
                gameTime++;

                // Reload
                if (player.reloading) {
                    player.reloadTimer--;
                    if (player.reloadTimer <= 0) {
                        player.reloading = false;
                        player.ammo = player.maxAmmo;
                        addFloatingText(player.x, player.y - 35, '✅ کامل شد!', '#0f0');
                        updateHUD();
                    }
                }
                if (reloadRequested) { reloadRequested = false;
                    startReload(); }

                // Cooldowns
                if (player.shootCooldown > 0) player.shootCooldown--;
                if (player.damageCooldown > 0) player.damageCooldown--;
                if (player.weaponBob > -3) player.weaponBob *= 0.85;

                // Movement
                let dx = 0,
                    dy = 0;
                if (keys.w) dy = -1;
                if (keys.s) dy = 1;
                if (keys.a) dx = -1;
                if (keys.d) dx = 1;
                if (dx !== 0 && dy !== 0) { dx *= 0.707;
                    dy *= 0.707; }

                const speed = player.speed * (keys.shift ? player.sprintMultiplier : 1);
                const newX = player.x + dx * speed * cappedDt;
                const newY = player.y + dy * speed * cappedDt;
                player.x = clamp(newX, 0, W - player.w);
                player.y = clamp(newY, 0, H - player.h);

                // Angle
                const ang = Math.atan2(mouseY - (player.y + player.h / 2), mouseX - (player.x + player.w / 2));
                player.angle = ang;

                // Flashlight
                if (fPressed) {
                    player.flashlight = !player.flashlight;
                    fPressed = false;
                    updateHUD();
                }

                // Shoot
                if (spacePressed || mouseDown) shoot();

                // ---- Bullets ----
                for (let i = activeBullets.length - 1; i >= 0; i--) {
                    const b = activeBullets[i];
                    b.x += b.vx * (cappedDt * 60);
                    b.y += b.vy * (cappedDt * 60);
                    b.life--;
                    if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20 || b.life <= 0) {
                        b.active = false;
                        bulletPool.release(b);
                        activeBullets.splice(i, 1);
                        continue;
                    }
                    let hit = false;
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const e = enemies[j];
                        if (e.dead) continue;
                        if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
                            e.hp -= b.damage;
                            createParticles(b.x, b.y, e.color, 12, 4, 20);
                            if (e.hp <= 0) {
                                e.dead = true;
                                kills++;
                                score += e.score;
                                createParticles(e.x + e.w / 2, e.y + e.h / 2, '#ffd740', 25, 6, 30);
                                addFloatingText(e.x, e.y, `+${e.score} ⭐`, '#ffd740');
                                screenShake = Math.max(screenShake, 4);
                                if (e.isBoss) {
                                    bossActive = false;
                                    bossDefeated = true;
                                    addFloatingText(W / 2, 120, '🎉 غول شکست خورد!', '#ffd740', 34);
                                    createParticles(e.x + e.w / 2, e.y + e.h / 2, '#ff1744', 50, 10, 40);
                                    screenShake = 20;
                                    score += 50;
                                    for (let p = 0; p < 3; p++) {
                                        ammoPickups.push({
                                            x: e.x + rand(-30, 30) + e.w / 2,
                                            y: e.y + rand(-30, 30) + e.h / 2,
                                            w: 16,
                                            h: 16,
                                            collected: false,
                                            amount: 4
                                        });
                                    }
                                    for (let p = 0; p < 2; p++) {
                                        healthPickups.push({
                                            x: e.x + rand(-30, 30) + e.w / 2,
                                            y: e.y + rand(-30, 30) + e.h / 2,
                                            w: 16,
                                            h: 16,
                                            collected: false,
                                            amount: 25
                                        });
                                    }
                                }
                            }
                            hit = true;
                            break;
                        }
                    }
                    if (hit) {
                        b.active = false;
                        bulletPool.release(b);
                        activeBullets.splice(i, 1);
                    }
                }

                // ---- Enemies ----
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    if (e.dead) continue;
                    if (e.stunTimer > 0) { e.stunTimer--; if (e.stunTimer === 0) e.state = 'chase'; continue; }

                    const dx2 = (player.x + player.w / 2) - (e.x + e.w / 2);
                    const dy2 = (player.y + player.h / 2) - (e.y + e.h / 2);
                    const d = Math.sqrt(dx2 * dx2 + dy2 * dy2);
                    const chaseDist = e.isBoss ? 400 : 300;

                    if (d > 10 && d < chaseDist) {
                        const spd = e.speed * (1 + gameTime / 300000);
                        const mx = (dx2 / d) * spd * (cappedDt * 60);
                        const my = (dy2 / d) * spd * (cappedDt * 60);
                        e.x += mx;
                        e.y += my;
                        e.x = clamp(e.x, -30, W - e.w + 30);
                        e.y = clamp(e.y, -30, H - e.h + 30);
                    } else if (d >= chaseDist) {
                        e.patrolTimer += 0.02 * (cappedDt * 60);
                        e.x += Math.sin(e.patrolTimer) * 0.5 * (cappedDt * 60);
                        e.y += Math.cos(e.patrolTimer * 0.7) * 0.5 * (cappedDt * 60);
                        e.x = clamp(e.x, 20, W - e.w - 20);
                        e.y = clamp(e.y, 20, H - e.h - 20);
                    }

                    if (e.isBoss && e.hp / e.maxHp < e.rageThreshold && !e.rageMode) {
                        e.rageMode = true;
                        e.speed *= 1.4;
                        e.damage *= 1.3;
                        e.color = '#ff1744';
                        addFloatingText(e.x + e.w / 2, e.y - 20, '🔥 خشم!', '#ff1744', 24);
                        createParticles(e.x + e.w / 2, e.y + e.h / 2, '#ff1744', 20, 5, 20);
                    }

                    if (rectCollide(e, player)) {
                        if (player.damageCooldown <= 0) {
                            const dmg = e.damage * (0.8 + Math.random() * 0.4);
                            player.hp -= dmg;
                            player.damageCooldown = 30;
                            screenShake = Math.max(screenShake, 10);
                            createParticles(player.x + player.w / 2, player.y + player.h / 2, '#f00', 20, 5, 25);
                            addFloatingText(player.x, player.y - 20, `-${Math.round(dmg)}`, '#f00');
                            if (d > 5) { e.x -= (dx2 / d) * 35;
                                e.y -= (dy2 / d) * 35; }
                            e.stunTimer = 15;
                            e.state = 'stunned';
                            updateHUD();
                            if (player.hp <= 0) {
                                state = STATE.GAMEOVER;
                                overlay.classList.add('visible');
                                overlayTitle.textContent = '💀 GAME OVER';
                                overlayDesc.textContent = `امتیاز: ${score} | کشته‌ها: ${kills} | مرحله: ${level}`;
                                overlayBtn.textContent = '🔄 بازی مجدد';
                                return;
                            }
                        }
                    }
                    if (e.isBoss && e.hp / e.maxHp < 0.3) e.eyeColor = '#FF0000';
                }

                // ---- Items ----
                for (let i = ammoPickups.length - 1; i >= 0; i--) {
                    const item = ammoPickups[i];
                    if (item.collected) continue;
                    if (rectCollide(player, item)) {
                        item.collected = true;
                        player.ammo = Math.min(player.maxAmmo, player.ammo + item.amount);
                        addFloatingText(item.x, item.y, `+${item.amount} 🔫`, '#0f0');
                        createParticles(item.x, item.y, '#0f0', 8, 3, 15);
                        ammoPickups.splice(i, 1);
                        updateHUD();
                    }
                }
                for (let i = healthPickups.length - 1; i >= 0; i--) {
                    const item = healthPickups[i];
                    if (item.collected) continue;
                    if (rectCollide(player, item)) {
                        item.collected = true;
                        player.hp = Math.min(player.maxHp, player.hp + item.amount);
                        addFloatingText(item.x, item.y, `+${item.amount} ❤️`, '#ff1744');
                        createParticles(item.x, item.y, '#ff1744', 8, 3, 15);
                        healthPickups.splice(i, 1);
                        updateHUD();
                    }
                }

                // ---- Spawn enemies ----
                const alive = enemies.filter(e => !e.dead).length;
                const needMore = levelEnemyCount - enemiesSpawned;
                if (needMore > 0 && alive < 3 + Math.floor(level / 2)) {
                    if (gameTime % 60 === 0 && Math.random() < 0.1) spawnEnemy(null);
                }

                // ---- Boss check ----
                if (!bossActive && !bossDefeated && enemiesSpawned >= levelEnemyCount) {
                    const alive2 = enemies.filter(e => !e.dead).length;
                    if (alive2 === 0) {
                        if (level % 5 === 0) spawnBoss();
                        else {
                            level++;
                            addFloatingText(W / 2, 100, `✅ مرحله ${level-1} کامل شد!`, '#4CAF50', 30);
                            setTimeout(() => startLevel(), 1500);
                        }
                    }
                }
                if (bossDefeated && !bossActive) {
                    const alive2 = enemies.filter(e => !e.dead).length;
                    if (alive2 === 0) {
                        level++;
                        addFloatingText(W / 2, 100, `🎉 مرحله ${level-1} با باس کامل شد!`, '#ffd740', 30);
                        setTimeout(() => startLevel(), 2000);
                        bossDefeated = false;
                    }
                }

                // ---- Particles ----
                for (let i = activeParticles.length - 1; i >= 0; i--) {
                    const p = activeParticles[i];
                    p.x += p.vx * (cappedDt * 60);
                    p.y += p.vy * (cappedDt * 60);
                    p.vy += 0.05 * (cappedDt * 60);
                    p.life--;
                    p.size *= 0.98;
                    if (p.life <= 0 || p.size < 0.3) {
                        p.active = false;
                        particlePool.release(p);
                        activeParticles.splice(i, 1);
                    }
                }
                for (let i = activeFloats.length - 1; i >= 0; i--) {
                    const f = activeFloats[i];
                    f.y += f.vy * (cappedDt * 60);
                    f.life--;
                    f.vy *= 0.98;
                    if (f.life <= 0) {
                        f.active = false;
                        floatPool.release(f);
                        activeFloats.splice(i, 1);
                    }
                }

                if (screenShake > 0) screenShake *= 0.93;
                if (screenShake < 0.1) screenShake = 0;
                updateHUD();
            }

            // ============================================================
            // 12. Draw
            // ============================================================
            function draw() {
                ctx.save();

                // Screen shake
                if (screenShake > 0.5) {
                    ctx.translate((Math.random() - 0.5) * screenShake * 1.8, (Math.random() - 0.5) * screenShake * 1.8);
                }

                // Background
                const grad = ctx.createRadialGradient(500, 325, 100, 500, 325, 550);
                grad.addColorStop(0, '#1a1a3e');
                grad.addColorStop(0.4, '#0f0f2a');
                grad.addColorStop(0.7, '#080818');
                grad.addColorStop(1, '#000');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // Grid
                ctx.strokeStyle = 'rgba(40,40,80,0.12)';
                ctx.lineWidth = 1;
                for (let i = 0; i < W; i += 45) { ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i, H);
                    ctx.stroke(); }
                for (let i = 0; i < H; i += 45) { ctx.beginPath();
                    ctx.moveTo(0, i);
                    ctx.lineTo(W, i);
                    ctx.stroke(); }

                // Ambient particles
                ctx.fillStyle = 'rgba(255,255,200,0.02)';
                for (let i = 0; i < 8; i++) {
                    const lx = (i * 137 + Math.sin(gameTime * 0.001 + i) * 50) % W;
                    const ly = (i * 97 + Math.cos(gameTime * 0.001 + i * 2) * 30) % H;
                    ctx.beginPath();
                    ctx.arc(lx, ly, 30 + Math.sin(gameTime * 0.005 + i) * 15, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Darkness / Flashlight
                if (!player.flashlight) {
                    const grd2 = ctx.createRadialGradient(
                        player.x + player.w / 2, player.y + player.h / 2, 20,
                        player.x + player.w / 2, player.y + player.h / 2, 160
                    );
                    grd2.addColorStop(0, 'rgba(0,0,0,0)');
                    grd2.addColorStop(0.4, 'rgba(0,0,0,0.4)');
                    grd2.addColorStop(0.7, 'rgba(0,0,0,0.7)');
                    grd2.addColorStop(1, 'rgba(0,0,0,0.95)');
                    ctx.fillStyle = grd2;
                    ctx.fillRect(0, 0, W, H);
                } else {
                    const ang = player.angle;
                    const grd2 = ctx.createRadialGradient(
                        player.x + player.w / 2, player.y + player.h / 2, 5,
                        player.x + player.w / 2, player.y + player.h / 2, 320
                    );
                    grd2.addColorStop(0, 'rgba(255,255,220,0.12)');
                    grd2.addColorStop(0.3, 'rgba(255,255,220,0.06)');
                    grd2.addColorStop(0.7, 'rgba(255,255,220,0.02)');
                    grd2.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = grd2;
                    ctx.beginPath();
                    ctx.moveTo(player.x + player.w / 2, player.y + player.h / 2);
                    const spread = 0.75;
                    ctx.arc(player.x + player.w / 2, player.y + player.h / 2, 320, ang - spread, ang + spread);
                    ctx.closePath();
                    ctx.fill();

                    ctx.shadowColor = 'rgba(255,255,200,0.08)';
                    ctx.shadowBlur = 50;
                    ctx.strokeStyle = 'rgba(255,255,200,0.04)';
                    ctx.lineWidth = 35;
                    ctx.beginPath();
                    ctx.moveTo(player.x + player.w / 2, player.y + player.h / 2);
                    ctx.lineTo(
                        player.x + player.w / 2 + Math.cos(ang) * 320,
                        player.y + player.h / 2 + Math.sin(ang) * 320
                    );
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                // Items
                for (let item of ammoPickups) {
                    if (item.collected) continue;
                    const pulse = Math.sin(gameTime * 0.06 + item.x) * 0.15 + 1;
                    ctx.shadowColor = '#0f0';
                    ctx.shadowBlur = 20 * pulse;
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#0f0';
                    ctx.fillText('📦', item.x + 8, item.y + 8);
                    ctx.shadowBlur = 0;
                }
                for (let item of healthPickups) {
                    if (item.collected) continue;
                    const pulse = Math.sin(gameTime * 0.06 + item.y) * 0.15 + 1;
                    ctx.shadowColor = '#ff1744';
                    ctx.shadowBlur = 20 * pulse;
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#ff1744';
                    ctx.fillText('❤️', item.x + 8, item.y + 8);
                    ctx.shadowBlur = 0;
                }

                // Enemies
                for (let e of enemies) {
                    if (e.dead) continue;
                    const cx = e.x + e.w / 2,
                        cy = e.y + e.h / 2,
                        size = e.w / 2;
                    ctx.shadowColor = e.color;
                    ctx.shadowBlur = e.isBoss ? 40 : 20;
                    const grad2 = ctx.createRadialGradient(
                        cx - size * 0.2, cy - size * 0.2, size * 0.1,
                        cx, cy, size
                    );
                    grad2.addColorStop(0, e.colorLight || e.color);
                    grad2.addColorStop(0.5, e.color);
                    grad2.addColorStop(1, e.colorDark || e.color);
                    ctx.fillStyle = grad2;
                    ctx.beginPath();
                    ctx.arc(cx, cy, size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Eyes
                    const eyeDist = size * 0.35,
                        eyeSize = size * 0.25;
                    ctx.shadowColor = e.eyeColor;
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath();
                    ctx.ellipse(cx - eyeDist, cy - size * 0.05, eyeSize, eyeSize * 1.1, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(cx + eyeDist, cy - size * 0.05, eyeSize, eyeSize * 1.1, 0, 0, Math.PI * 2);
                    ctx.fill();

                    const lookAngle = Math.atan2(
                        (player.y + player.h / 2) - cy,
                        (player.x + player.w / 2) - cx
                    );
                    const lookOffset = eyeSize * 0.3;
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = e.eyeColor;
                    ctx.beginPath();
                    ctx.arc(cx - eyeDist + Math.cos(lookAngle) * lookOffset, cy - size * 0.05 + Math.sin(lookAngle) *
                        lookOffset * 0.6, eyeSize * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + eyeDist + Math.cos(lookAngle) * lookOffset, cy - size * 0.05 + Math.sin(lookAngle) *
                        lookOffset * 0.6, eyeSize * 0.6, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(cx - eyeDist + Math.cos(lookAngle) * lookOffset * 1.1, cy - size * 0.05 + Math.sin(lookAngle) *
                        lookOffset * 0.7, eyeSize * 0.25, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + eyeDist + Math.cos(lookAngle) * lookOffset * 1.1, cy - size * 0.05 + Math.sin(lookAngle) *
                        lookOffset * 0.7, eyeSize * 0.25, 0, Math.PI * 2);
                    ctx.fill();

                    // Mouth
                    ctx.shadowBlur = 0;
                    const mouthY = cy + size * 0.25,
                        mouthW = size * 0.5;
                    ctx.fillStyle = e.mouthColor || '#000';
                    ctx.beginPath();
                    ctx.ellipse(cx, mouthY, mouthW, size * 0.15, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // HP bar
                    if (e.hp < e.maxHp || e.isBoss) {
                        const bw = e.isBoss ? size * 1.6 : size * 1.2;
                        const bh = e.isBoss ? 6 : 4;
                        const by = cy - size - (e.isBoss ? 26 : 12);
                        ctx.fillStyle = 'rgba(0,0,0,0.6)';
                        ctx.fillRect(cx - bw / 2, by, bw, bh);
                        const hpRatio = e.hp / e.maxHp;
                        ctx.fillStyle = hpRatio > 0.3 ? '#4CAF50' : '#ff1744';
                        ctx.fillRect(cx - bw / 2, by, bw * Math.max(0, hpRatio), bh);
                    }

                    // Boss extras
                    if (e.isBoss) {
                        ctx.shadowColor = '#ff1744';
                        ctx.shadowBlur = 40;
                        ctx.strokeStyle = `rgba(255,23,68,${0.2 + Math.sin(gameTime * 0.05) * 0.1})`;
                        ctx.lineWidth = 3;
                        ctx.setLineDash([8, 8]);
                        ctx.beginPath();
                        ctx.arc(cx, cy, size + 10, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.setLineDash([]);
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#ff1744';
                        ctx.font = 'bold 14px "Courier New", monospace';
                        ctx.textAlign = 'center';
                        ctx.shadowColor = '#ff1744';
                        ctx.shadowBlur = 20;
                        ctx.fillText(e.name, cx, cy - size - 18);
                        ctx.shadowBlur = 0;
                        if (e.rageMode) {
                            ctx.fillStyle = 'rgba(255,0,0,0.1)';
                            ctx.beginPath();
                            ctx.arc(cx, cy, size + 15, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }

                // Bullets
                for (let b of activeBullets) {
                    ctx.shadowColor = b.color;
                    ctx.shadowBlur = 25;
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // Player
                const px = player.x,
                    py = player.y;
                const cx2 = px + player.w / 2,
                    cy2 = py + player.h / 2;
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 20;
                ctx.shadowOffsetY = 5;
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#1a2a3a';
                ctx.beginPath();
                ctx.roundRect(px + 2, py + 8, player.w - 4, player.h - 12, 4);
                ctx.fill();
                ctx.fillStyle = '#2a3a4a';
                ctx.beginPath();
                ctx.roundRect(px + 4, py + 12, player.w - 8, 14, 3);
                ctx.fill();
                ctx.shadowBlur = 8;
                ctx.fillStyle = '#2a4a3a';
                ctx.beginPath();
                ctx.arc(cx2, py + 6, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;

                // Eyes
                const eyeAng = player.angle;
                const eyeOffX = Math.cos(eyeAng) * 3,
                    eyeOffY = Math.sin(eyeAng) * 2;
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.arc(cx2 - 5 + eyeOffX, py + 4 + eyeOffY, 4.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(cx2 + 5 + eyeOffX, py + 4 + eyeOffY, 4.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1A237E';
                ctx.beginPath();
                ctx.arc(cx2 - 3 + eyeOffX * 1.2, py + 5 + eyeOffY * 1.2, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(cx2 + 7 + eyeOffX * 1.2, py + 5 + eyeOffY * 1.2, 2.5, 0, Math.PI * 2);
                ctx.fill();

                // Weapon
                const wx = cx2 + Math.cos(player.angle) * 22,
                    wy = cy2 + Math.sin(player.angle) * 22;
                const wobble = player.weaponBob;
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetY = 2;
                ctx.fillStyle = '#2a3a4a';
                ctx.fillRect(wx - 3, wy - 2 + wobble, 16, 4);
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(wx + 10, wy - 5 + wobble, 8, 10);
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;

                // Particles
                for (let p of activeParticles) {
                    const alpha = p.life / (p.maxLife || 30);
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 15 * alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, Math.max(0.5, p.size * alpha), 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;

                // Floating texts
                for (let f of activeFloats) {
                    const alpha = f.life / f.maxLife;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = f.color;
                    ctx.font = `bold ${f.size}px "Courier New", monospace`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = f.color;
                    ctx.shadowBlur = 20 * alpha;
                    ctx.fillText(f.text, f.x, f.y);
                    ctx.shadowBlur = 0;
                }
                ctx.globalAlpha = 1;

                // Mini HUD on canvas
                ctx.fillStyle = 'rgba(0,255,0,0.1)';
                ctx.font = '12px "Courier New", monospace';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillText(`⏱ ${Math.floor(gameTime / 60)}s`, 15, H - 15);
                ctx.textAlign = 'right';
                ctx.fillText(`👾 ${enemies.filter(e => !e.dead).length}`, W - 15, H - 15);

                ctx.restore();
            }

            // ============================================================
            // 13. Game Loop
            // ============================================================
            function gameLoop(timestamp) {
                if (!lastTimestamp) lastTimestamp = timestamp;
                const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.05);
                lastTimestamp = timestamp;

                if (state === STATE.MENU) {
                    gameTime++;
                    draw();
                    requestAnimationFrame(gameLoop);
                    return;
                }

                update(dt);
                draw();
                requestAnimationFrame(gameLoop);
            }

            // ============================================================
            // 14. RoundRect polyfill
            // ============================================================
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (r > w / 2) r = w / 2;
                    if (r > h / 2) r = h / 2;
                    this.moveTo(x + r, y);
                    this.lineTo(x + w - r, y);
                    this.quadraticCurveTo(x + w, y, x + w, y + r);
                    this.lineTo(x + w, y + h - r);
                    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    this.lineTo(x + r, y + h);
                    this.quadraticCurveTo(x, y + h, x, y + h - r);
                    this.lineTo(x, y + r);
                    this.quadraticCurveTo(x, y, x + r, y);
                    this.closePath();
                    return this;
                };
            }

            // ============================================================
            // 15. Start
            // ============================================================
            // Show menu
            overlay.classList.add('visible');
            overlayTitle.textContent = '🎮 DOOM 3 × Poppy';
            overlayDesc.textContent = 'هاگی واگی در تاریکی کمین کرده...';
            overlayBtn.textContent = '▶ شروع بازی';

            gameLoop(0);

            console.log('🎮 DOOM 3 × Poppy Playtime - نسخه کامل با کنترلر لمسی');
            console.log('🕹️ WASD حرکت | F چراغ | Space شلیک | R مهمات | Shift دویدن');

            // Cleanup
            window.addEventListener('beforeunload', () => {
                bulletPool.clear();
                particlePool.clear();
                floatPool.clear();
            });

        })();
    </script>

</body>
