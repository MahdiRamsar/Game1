        /* ================================================================
           لایه‌بندی CSS (Cascade Layers)
           ================================================================ */
        @layer reset, base, components, utilities, theme;

        /* ---------- RESET ---------- */
        @layer reset {
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                user-select: none;
            }
            body {
                background: #000;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                font-family: 'Courier New', monospace;
                overflow: hidden;
                touch-action: none;
            }
        }

        /* ---------- BASE ---------- */
        @layer base {
            :root {
                --bg-dark: #0a0a0a;
                --border-color: #1a1a3e;
                --text-green: #0f0;
                --text-gold: #ffd740;
                --text-red: #ff1744;
                --shadow-glow: 0 0 80px rgba(233, 69, 96, 0.15);
                --radius-lg: 24px;
                --radius-md: 16px;
                --font-mono: 'Courier New', monospace;
            }

            /* احترام به تنظیمات سیستم */
            @media (prefers-color-scheme: light) {
                :root {
                    --bg-dark: #1a1a2e;
                    --border-color: #3a3a6e;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                * {
                    animation-duration: 0.01ms !important;
                    transition-duration: 0.01ms !important;
                }
            }
        }

        /* ---------- COMPONENTS ---------- */
        @layer components {
            .game-wrapper {
                background: var(--bg-dark);
                padding: clamp(8px, 2vw, 20px);
                border-radius: var(--radius-lg);
                border: 2px solid var(--border-color);
                box-shadow: var(--shadow-glow), inset 0 0 60px rgba(0, 0, 0, 0.8);
                position: relative;
                width: min(100%, 1040px);
            }

            canvas#gameCanvas {
                display: block;
                width: 100%;
                height: auto;
                aspect-ratio: 1000/650;
                border-radius: var(--radius-md);
                cursor: crosshair;
                touch-action: none;
                background: #0a0a15;
                outline: none;
                tabindex: 0;
                /* برای دسترسی‌پذیری */
                aria-label: "بوم بازی DOOM 3 × Poppy Playtime";
                role: "application";
            }

            .hud {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: clamp(6px, 1vh, 12px) clamp(12px, 2vw, 24px);
                margin-top: clamp(8px, 1.5vh, 16px);
                background: rgba(0, 0, 0, 0.85);
                border-radius: 30px;
                border: 1px solid var(--border-color);
                color: var(--text-green);
                font-size: clamp(0.6rem, 1.2vw, 0.9rem);
                flex-wrap: wrap;
                gap: 6px 12px;
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
            }

            .hud-item {
                display: flex;
                align-items: center;
                gap: 4px 8px;
                text-shadow: 0 0 15px rgba(0, 255, 0, 0.15);
                white-space: nowrap;
            }
            .hud-item .val {
                color: var(--text-gold);
                font-weight: bold;
                min-width: 24px;
            }
            .hud-item .val.hp {
                color: var(--text-red);
            }

            .controls-note {
                color: #555;
                text-align: center;
                margin-top: clamp(6px, 1vh, 12px);
                font-size: clamp(0.55rem, 1vw, 0.75rem);
                background: rgba(0, 0, 0, 0.6);
                padding: 4px 12px;
                border-radius: 20px;
                border: 1px solid #1a1a2e;
            }
            .controls-note kbd {
                background: #1a1a2e;
                padding: 2px 10px;
                border-radius: 4px;
                color: var(--text-green);
                border: 1px solid #333;
                font-size: 0.8em;
            }

            #focus-hint {
                position: fixed;
                bottom: clamp(60px, 12vh, 120px);
                left: 50%;
                transform: translateX(-50%);
                color: var(--text-gold);
                font-size: clamp(14px, 2vw, 18px);
                background: rgba(0, 0, 0, 0.85);
                padding: 10px 24px;
                border-radius: 30px;
                border: 1px solid var(--text-gold);
                font-family: var(--font-mono);
                z-index: 999;
                opacity: 0;
                transition: opacity 0.5s ease;
                pointer-events: none;
                text-align: center;
                max-width: 90vw;
            }
        }

        /* ---------- UTILITIES ---------- */
        @layer utilities {
            .visually-hidden {
                position: absolute !important;
                width: 1px !important;
                height: 1px !important;
                padding: 0 !important;
                margin: -1px !important;
                overflow: hidden !important;
                clip: rect(0, 0, 0, 0) !important;
                border: 0 !important;
            }
        }

        /* ---------- THEME (تغییرات واکنش‌گرا) ---------- */
        @layer theme {
            /* استفاده از container query برای تطبیق HUD */
            .game-wrapper {
                container-type: inline-size;
            }
            @container (max-width: 600px) {
                .hud {
                    font-size: 0.55rem;
                    padding: 4px 8px;
                    gap: 3px 6px;
                }
                .controls-note {
                    font-size: 0.5rem;
                }
            }
            @container (max-width: 420px) {
                .hud-item .val {
                    min-width: 16px;
                }
            }
        }
    </style>

    <!-- ================================================================

    <script type="module" nonce="2026SecureNonce">
        /* ================================================================
           ماژول‌های داخلی (برای رعایت import/export، هر بخش را به صورت
           یک ماژول مجازی با Blob URL بارگذاری می‌کنیم)
           ================================================================ */

        // ---- ابزارهای کمکی (utils) ----
        const utilsCode = `
            export function dist(a, b) {
                return Math.hypot(a.x - b.x, a.y - b.y);
            }
            export function rectCollide(a, b) {
                return a.x < b.x + b.w && a.x + a.w > b.x &&
                       a.y < b.y + b.h && a.y + a.h > b.y;
            }
            export function rand(min, max) { return Math.random() * (max - min) + min; }
            export function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
            export function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
            export function lerp(a, b, t) { return a + (b - a) * t; }
        `;

        // ---- پیکربندی (config) ----
        const configCode = `
            export const W = 1000;

            export const ENEMY_TYPES = {

        // ---- مدیریت ورودی (InputManager) ----
        const inputCode = `
            import { W, H } from './config.js';

            export class InputManager {
                constructor(canvas) {
                    this.keys = { w: false, a: false, s: false, d: false, shift: false };
                    this.mouseX = W/2;
                    this.mouseY = H/2;
                    this.spacePressed = false;
                    this.fPressed = false;
                    this.mouseDown = false;
                    this.canvas = canvas;
                    this.abortController = new AbortController();
                    this._bindEvents();
                }

                _bindEvents() {
                    const signal = this.abortController.signal;
                    const doc = document;
                    const c = this.canvas;

                    // کیبورد
                    doc.addEventListener('keydown', (e) => {
                        const key = e.key;
                        if (['w','W','a','A','s','S','d','D',' ','f','F','r','R','Shift','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(key)) {
                            e.preventDefault();
                        }
                        if (key === 'w' || key === 'W' || key === 'ArrowUp') this.keys.w = true;
                        if (key === 's' || key === 'S' || key === 'ArrowDown') this.keys.s = true;
                        if (key === 'a' || key === 'A' || key === 'ArrowLeft') this.keys.a = true;
                        if (key === 'd' || key === 'D' || key === 'ArrowRight') this.keys.d = true;
                        if (key === 'Shift') this.keys.shift = true;
                        if (key === ' ') this.spacePressed = true;
                        if (key === 'f' || key === 'F') this.fPressed = true;
                    }, { signal });

                    doc.addEventListener('keyup', (e) => {
                        const key = e.key;
                        if (['w','W','a','A','s','S','d','D',' ','Shift','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(key)) {
                            e.preventDefault();
                        }
                        if (key === 'w' || key === 'W' || key === 'ArrowUp') this.keys.w = false;
                        if (key === 's' || key === 'S' || key === 'ArrowDown') this.keys.s = false;
                        if (key === 'a' || key === 'A' || key === 'ArrowLeft') this.keys.a = false;
                        if (key === 'd' || key === 'D' || key === 'ArrowRight') this.keys.d = false;
                        if (key === 'Shift') this.keys.shift = false;
                        if (key === ' ') this.spacePressed = false;
                    }, { signal });

                    // ماوس
                    c.addEventListener('mousemove', (e) => {
                        const rect = c.getBoundingClientRect();
                        const scaleX = c.width / rect.width;
                        const scaleY = c.height / rect.height;
                        this.mouseX = (e.clientX - rect.left) * scaleX;
                        this.mouseY = (e.clientY - rect.top) * scaleY;
                    }, { signal });

                    c.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        this.mouseDown = true;
                    }, { signal });

                    c.addEventListener('mouseup', () => { this.mouseDown = false; }, { signal });
                    c.addEventListener('mouseleave', () => { this.mouseDown = false; }, { signal });

                    // لمسی
                    c.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        const touch = e.touches[0];
                        const rect = c.getBoundingClientRect();
                        const scaleX = c.width / rect.width;
                        const scaleY = c.height / rect.height;
                        this.mouseX = (touch.clientX - rect.left) * scaleX;
                        this.mouseY = (touch.clientY - rect.top) * scaleY;
                        this.mouseDown = true;
                    }, { signal, passive: false });

                    c.addEventListener('touchmove', (e) => {
                        e.preventDefault();
                        const touch = e.touches[0];
                        const rect = c.getBoundingClientRect();
                        const scaleX = c.width / rect.width;
                        const scaleY = c.height / rect.height;
                        this.mouseX = (touch.clientX - rect.left) * scaleX;
                        this.mouseY = (touch.clientY - rect.top) * scaleY;
                    }, { signal, passive: false });

                    c.addEventListener('touchend', () => { this.mouseDown = false; }, { signal });

                    // گیم‌پد (Gamepad API) - هر فریم چک می‌شود
                }

                // متد برای خواندن گیم‌پد (هر فریم صدا زده شود)
                updateGamepad() {
                    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
                    for (const gp of gamepads) {
                        if (!gp) continue;
                        // استفاده از اولین گیم‌پد متصل
                        const axes = gp.axes;
                        const buttons = gp.buttons;
                        if (axes.length >= 2) {
                            const deadZone = 0.2;
                            const ax = Math.abs(axes[0]) > deadZone ? axes[0] : 0;
                            const ay = Math.abs(axes[1]) > deadZone ? axes[1] : 0;
                            this.keys.a = ax < -0.3;
                            this.keys.d = ax > 0.3;
                            this.keys.w = ay < -0.3;
                            this.keys.s = ay > 0.3;
                        }
                        if (buttons.length >= 8) {
                            this.spacePressed = buttons[0]?.pressed || false; // A
                            this.keys.shift = buttons[7]?.pressed || false;   // RB
                            if (buttons[2]?.pressed) this.fPressed = true;    // X
                            if (buttons[3]?.pressed) this.fPressed = true;    // Y
                        }
                        break;
                    }
                }

                // رویدادهای اضافی مثلاً برای startGame
                onKeyEnter(callback) {
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') callback();
                    }, { signal: this.abortController.signal });
                }

                destroy() {
                    this.abortController.abort();
                }
            }
        `;

        // ---- مدیریت منابع (AssetManager) ----
        const assetCode = `
            export class AssetManager {
                constructor() {
                    this.images = new Map();
                    this.sounds = new Map();
                    this.audioCtx = null;
                }

                initAudio() {
                    if (!this.audioCtx) {
                        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    return this.audioCtx;
                }

                // بارگذاری تصویر (با کش)
                async loadImage(name, url) {
                    if (this.images.has(name)) return this.images.get(name);
                    return new Promise((resolve) => {
                        const img = new Image();
                        img.onload = () => {
                            this.images.set(name, img);
                            resolve(img);
                        };
                        img.onerror = () => resolve(null);
                        img.src = url;
                    });
                }

                // بارگذاری صدا (با Web Audio)
                async loadSound(name, url) {
                    if (this.sounds.has(name)) return this.sounds.get(name);
                    const ctx = this.initAudio();
                    try {
                        const response = await fetch(url);
                        const arrayBuffer = await response.arrayBuffer();
                        const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
                        this.sounds.set(name, audioBuffer);
                        return audioBuffer;
                    } catch {
                        return null;
                    }
                }

                // پخش صدا
                playSound(name, volume = 0.3) {
                    const buffer = this.sounds.get(name);
                    if (!buffer || !this.audioCtx) return;
                    const source = this.audioCtx.createBufferSource();
                    source.buffer = buffer;
                    const gain = this.audioCtx.createGain();
                    gain.gain.value = volume;
                    source.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    source.start();
                }
            }
        `;

        // ---- مدیریت اشیاء (Object Pool) ----
        const poolCode = `
            export class ObjectPool {
                constructor(factory, reset, initialSize = 0) {
                    this.factory = factory;
                    this.reset = reset;
                    this.pool = [];
                    for (let i = 0; i < initialSize; i++) {
                        this.pool.push(this.factory());
                    }
                }

                acquire() {
                    if (this.pool.length > 0) {
                        const obj = this.pool.pop();
                        this.reset(obj);
                        return obj;
                    }
                    return this.factory();
                }

                release(obj) {
                    this.pool.push(obj);
                }

                clear() {
                    this.pool = [];
                }
            }
        `;

        // ---- کلاس‌های اصلی بازی (بازنویسی شده با delta time و بهینه‌سازی) ----
        // برای سادگی، بقیه کد را در یک ماژول main قرار می‌دهیم
        const mainCode = `
            import { W, H, ENEMY_TYPES, BOSS_TYPES } from './config.js';
            import { dist, rectCollide, rand, randInt, clamp, lerp } from './utils.js';
            import { InputManager } from './InputManager.js';
            import { AssetManager } from './AssetManager.js';
            import { ObjectPool } from './ObjectPool.js';

            // ----------------------------------------------------------------
            // 1. عناصر DOM
            // ----------------------------------------------------------------
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const hpSpan = document.getElementById('hpDisplay');
            const ammoSpan = document.getElementById('ammoDisplay');
            const lightSpan = document.getElementById('lightDisplay');
            const enemySpan = document.getElementById('enemyDisplay');
            const scoreSpan = document.getElementById('scoreDisplay');
            const levelSpan = document.getElementById('levelDisplay');
            const killSpan = document.getElementById('killDisplay');
            const statusEl = document.getElementById('a11y-status');

            // ----------------------------------------------------------------
            // 2. مدیریت ورودی و منابع
            // ----------------------------------------------------------------
            const input = new InputManager(canvas);
            const assets = new AssetManager();

            // ----------------------------------------------------------------
            // 3. State Machine
            // ----------------------------------------------------------------
            const GameState = {
                MENU: 'MENU',
                PLAYING: 'PLAYING',
                GAMEOVER: 'GAMEOVER'
            };

            let state = GameState.MENU;
            let score = 0;
            let kills = 0;
            let level = 1;
            let gameTime = 0;       // بر حسب فریم (برای انیمیشن)
            let deltaTime = 0;      // زمان بین فریم‌ها (ثانیه)
            let screenShake = 0;
            let levelEnemyCount = 0;
            let enemiesSpawned = 0;
            let bossActive = false;
            let bossDefeated = false;
            let levelComplete = false;
            let lastTimestamp = 0;

            // ----------------------------------------------------------------
            // 4. بازیکن
            // ----------------------------------------------------------------
            const player = {
                x: 500, y: 325,
                w: 32, h: 38,
                speed: 180,          // پیکسل در ثانیه
                sprintMultiplier: 1.6,
                hp: 100,
                maxHp: 100,
                ammo: 12,
                maxAmmo: 12,
                flashlight: false,
                angle: 0,
                shootCooldown: 0,    // بر حسب فریم
                reloading: false,
                reloadTimer: 0,
                damageCooldown: 0,
                weaponBob: 0,
                bobPhase: 0
            };

            // ----------------------------------------------------------------
            // 5. Object Pools
            // ----------------------------------------------------------------
            // گلوله
            function bulletFactory() {
                return {
                    x: 0, y: 0, vx: 0, vy: 0,
                    life: 0,
                    damage: 20,
                    radius: 4,
                    color: '#00ff88',
                    active: false
                };
            }
            function bulletReset(b) {
                b.x = 0; b.y = 0; b.vx = 0; b.vy = 0;
                b.life = 0;
                b.damage = 20;
                b.radius = 4;
                b.color = '#00ff88';
                b.active = false;
            }
            const bulletPool = new ObjectPool(bulletFactory, bulletReset, 30);

            // ذره
            function particleFactory() {
                return {
                    x: 0, y: 0, vx: 0, vy: 0,
                    life: 0, maxLife: 30,
                    color: '#fff', size: 4,
                    active: false
                };
            }
            function particleReset(p) {
                p.x = 0; p.y = 0; p.vx = 0; p.vy = 0;
                p.life = 0; p.maxLife = 30;
                p.color = '#fff'; p.size = 4;
                p.active = false;
            }
            const particlePool = new ObjectPool(particleFactory, particleReset, 100);

            // متن شناور
            function floatTextFactory() {
                return {
                    x: 0, y: 0, text: '',
                    color: '#fff', size: 20,
                    life: 0, maxLife: 50,
                    vy: -1.2, active: false
                };
            }
            function floatTextReset(f) {
                f.x = 0; f.y = 0; f.text = '';
                f.color = '#fff'; f.size = 20;
                f.life = 0; f.maxLife = 50;
                f.vy = -1.2;
                f.active = false;
            }
            const floatTextPool = new ObjectPool(floatTextFactory, floatTextReset, 20);

            // دشمنان (با آرایه معمولی چون تعدادشان متغیر است)
            let enemies = [];

            // آیتم‌ها (آرایه)
            let ammoPickups = [];
            let healthPickups = [];

            // گلوله‌های فعال (از pool)
            const activeBullets = [];
            const activeParticles = [];
            const activeFloatTexts = [];

            // ----------------------------------------------------------------
            // 6. توابع کمکی برای خلق اشیاء
            // ----------------------------------------------------------------
            function createParticles(x, y, color, count = 12, speed = 5, life = 30) {
                for (let i = 0; i < count; i++) {
                    const p = particlePool.acquire();
                    const angle = rand(0, Math.PI * 2);
                    const spd = rand(1, speed);
                    p.x = x;
                    p.y = y;
                    p.vx = Math.cos(angle) * spd;
                    p.vy = Math.sin(angle) * spd - 0.5;
                    p.life = rand(life * 0.5, life);
                    p.maxLife = life;
                    p.color = color;
                    p.size = rand(2, 6);
                    p.active = true;
                    activeParticles.push(p);
                }
            }

            function addFloatingText(x, y, text, color = '#fff', size = 20) {
                const f = floatTextPool.acquire();
                f.x = x;
                f.y = y;
                f.text = text;
                f.color = color;
                f.size = size;
                f.life = 50;
                f.maxLife = 50;
                f.vy = -1.2;
                f.active = true;
                activeFloatTexts.push(f);
            }

            function spawnBullet(x, y, angle, speed, damage, color = '#00ff88') {
                const b = bulletPool.acquire();
                b.x = x;
                b.y = y;
                const spread = 0.04;
                const a = angle + rand(-spread, spread);
                b.vx = Math.cos(a) * speed;
                b.vy = Math.sin(a) * speed;
                b.life = 70;
                b.damage = damage;
                b.radius = 4;
                b.color = color;
                b.active = true;
                activeBullets.push(b);
            }

            // ----------------------------------------------------------------
            // 7. تولید دشمنان و باس
            // ----------------------------------------------------------------
            function spawnEnemy(type = null) {
                const side = randInt(0, 3);
                let x, y;
                const pad = 60;
                if (side === 0) { x = -pad; y = rand(0, H); }
                else if (side === 1) { x = W + pad; y = rand(0, H); }
                else if (side === 2) { x = rand(0, W); y = -pad; }
                else { x = rand(0, W); y = H + pad; }

                const types = Object.keys(ENEMY_TYPES);
                const selected = type || types[randInt(0, types.length - 1)];
                const data = ENEMY_TYPES[selected];

                const levelScale = 1 + (level - 1) * 0.12;
                const hpScale = 1 + (level - 1) * 0.08;

                enemies.push({
                    x, y,
                    w: data.size, h: data.size,
                    hp: data.hp * hpScale,
                    maxHp: data.hp * hpScale,
                    speed: data.speed * levelScale * (0.9 + Math.random() * 0.2),
                    type: selected,
                    color: data.color,
                    colorDark: data.colorDark,
                    colorLight: data.colorLight,
                    score: Math.round(data.score * (1 + (level-1) * 0.05)),
                    damage: data.damage * (1 + (level-1) * 0.06),
                    eyeColor: data.eyeColor,
                    mouthColor: data.mouthColor,
                    state: 'chase',
                    stunTimer: 0,
                    attackCooldown: 0,
                    name: data.name,
                    isBoss: false,
                    dead: false,
                    phase: 0,
                    spawnX: x,
                    spawnY: y,
                    patrolTimer: rand(0, 100)
                });
                enemiesSpawned++;
            }

            function spawnBoss() {
                const side = randInt(0, 3);
                let x, y;
                const pad = 80;
                if (side === 0) { x = -pad; y = rand(100, H-100); }
                else if (side === 1) { x = W + pad; y = rand(100, H-100); }
                else if (side === 2) { x = rand(100, W-100); y = -pad; }
                else { x = rand(100, W-100); y = H + pad; }

                const types = Object.keys(BOSS_TYPES);
                const selected = types[randInt(0, types.length - 1)];
                const data = BOSS_TYPES[selected];

                const levelScale = 1 + (level - 1) * 0.08;

                enemies.push({
                    x, y,
                    w: data.size, h: data.size,
                    hp: data.hp * levelScale,
                    maxHp: data.hp * levelScale,
                    speed: data.speed * (0.9 + Math.random() * 0.2),
                    type: selected,
                    color: data.color,
                    colorDark: data.colorDark,
                    colorLight: data.colorLight,
                    score: data.score,
                    damage: data.damage * (1 + (level-1) * 0.05),
                    eyeColor: data.eyeColor,
                    mouthColor: data.mouthColor,
                    state: 'chase',
                    stunTimer: 0,
                    attackCooldown: 0,
                    name: data.name,
                    isBoss: true,
                    dead: false,
                    phase: 0,
                    spawnX: x,
                    spawnY: y,
                    patrolTimer: 0,
                    rageMode: false,
                    rageThreshold: 0.5
                });
                bossActive = true;
                bossDefeated = false;
                addFloatingText(W/2, 100, \`⚠️ \${data.name} ظاهر شد!\`, '#ff1744', 32);
                createParticles(x, y, '#ff1744', 40, 8, 40);
                screenShake = 15;
                assets.playSound('boss', 0.5);
            }

            // ----------------------------------------------------------------
            // 8. شروع مرحله
            // ----------------------------------------------------------------
            function startLevel() {
                levelEnemyCount = 5 + level * 2;
                enemiesSpawned = 0;
                bossActive = false;
                bossDefeated = false;
                levelComplete = false;

                enemies = enemies.filter(e => e.dead);

                const initialCount = Math.min(3 + Math.floor(level / 2), 8);
                for (let i = 0; i < initialCount; i++) {
                    setTimeout(() => spawnEnemy(null), i * 300);
                }

                for (let i = 0; i < Math.min(2 + level, 6); i++) {
                    setTimeout(() => {
                        ammoPickups.push({
                            x: rand(50, W-50),
                            y: rand(50, H-50),
                            w: 16, h: 16,
                            collected: false,
                            amount: 3 + randInt(0, 3)
                        });
                    }, 500 + i * 200);
                }
                for (let i = 0; i < Math.min(1 + Math.floor(level/3), 4); i++) {
                    setTimeout(() => {
                        healthPickups.push({
                            x: rand(50, W-50),
                            y: rand(50, H-50),
                            w: 16, h: 16,
                            collected: false,
                            amount: 15 + randInt(0, 15)
                        });
                    }, 800 + i * 300);
                }

                addFloatingText(W/2, 80, \`📍 مرحله \${level}\`, '#4CAF50', 28);
                updateHUD();
                statusEl.textContent = \`مرحله \${level} شروع شد\`;
            }

            // ----------------------------------------------------------------
            // 9. شروع بازی
            // ----------------------------------------------------------------
            function startGame() {
                state = GameState.PLAYING;
                score = 0;
                kills = 0;
                level = 1;
                gameTime = 0;
                screenShake = 0;
                player.x = 500; player.y = 325;
                player.hp = 100;
                player.ammo = 12;
                player.flashlight = false;
                player.reloading = false;
                player.reloadTimer = 0;
                player.damageCooldown = 0;
                enemies = [];
                activeBullets.length = 0;
                activeParticles.length = 0;
                activeFloatTexts.length = 0;
                ammoPickups = [];
                healthPickups = [];
                bossActive = false;
                bossDefeated = false;
                levelComplete = false;
                canvas.focus();
                startLevel();
                const hint = document.getElementById('focus-hint');
                if (hint) hint.style.opacity = '0';
                statusEl.textContent = 'بازی شروع شد';
                assets.initAudio();
                // بارگذاری صداها (مثال)
                assets.loadSound('shoot', 'data:audio/wav;base64,U3R1ZmYgd2F2'); // placeholder
                assets.loadSound('boss', 'data:audio/wav;base64,U3R1ZmYgd2F2');
            }

            // ----------------------------------------------------------------
            // 10. شلیک
            // ----------------------------------------------------------------
            function shoot() {
                if (state !== GameState.PLAYING) return;
                if (player.reloading) return;
                if (player.shootCooldown > 0) return;
                if (player.ammo <= 0) {
                    startReload();
                    return;
                }

                player.ammo--;
                player.shootCooldown = 8;
                screenShake = Math.max(screenShake, 5);
                player.weaponBob = -3;

                const ang = player.angle;
                const cx = player.x + player.w/2;
                const cy = player.y + player.h/2;
                const speed = 10 + (level * 0.1);
                const dmg = 20 + Math.floor(level / 3) * 2;

                spawnBullet(
                    cx + Math.cos(ang) * 25,
                    cy + Math.sin(ang) * 25,
                    ang, speed, dmg, '#00ff88'
                );

                createParticles(cx + Math.cos(ang)*25, cy + Math.sin(ang)*25, '#ffd740', 6, 3, 12);
                createParticles(cx + Math.cos(ang)*25, cy + Math.sin(ang)*25, '#ff6f00', 4, 2, 8);
                assets.playSound('shoot', 0.2);
                updateHUD();
            }

            function startReload() {
                if (player.reloading) return;
                if (player.ammo === player.maxAmmo) return;
                player.reloading = true;
                player.reloadTimer = 50;
                addFloatingText(player.x, player.y - 35, '🔄 بارگذاری...', '#0f0');
            }

            // ----------------------------------------------------------------
            // 11. HUD
            // ----------------------------------------------------------------
            function updateHUD() {
                hpSpan.textContent = Math.max(0, Math.round(player.hp));
                ammoSpan.textContent = player.reloading ? '...' : player.ammo;
                lightSpan.textContent = player.flashlight ? '💡' : '🌑';
                lightSpan.style.color = player.flashlight ? '#ffd740' : '#666';
                enemySpan.textContent = enemies.filter(e => !e.dead).length;
                scoreSpan.textContent = score;
                levelSpan.textContent = level;
                killSpan.textContent = kills;
            }

            // ----------------------------------------------------------------
            // 12. بروزرسانی (با delta time)
            // ----------------------------------------------------------------
            function update(dt) {
                if (state !== GameState.PLAYING) return;

                // محدود کردن dt برای جلوگیری از پرش
                const cappedDt = Math.min(dt, 0.05);
                gameTime++;

                // بارگذاری مجدد
                if (player.reloading) {
                    player.reloadTimer--;
                    if (player.reloadTimer <= 0) {
                        player.reloading = false;
                        player.ammo = player.maxAmmo;
                        addFloatingText(player.x, player.y - 35, '✅ کامل شد!', '#0f0');
                        updateHUD();
                    }
                }

                // کولداون‌ها
                if (player.shootCooldown > 0) player.shootCooldown--;
                if (player.damageCooldown > 0) player.damageCooldown--;
                if (player.weaponBob > -3) player.weaponBob *= 0.85;
                player.bobPhase += 0.05 * (cappedDt * 60);

                // حرکت
                let dx = 0, dy = 0;
                if (input.keys.w) dy = -1;
                if (input.keys.s) dy = 1;
                if (input.keys.a) dx = -1;
                if (input.keys.d) dx = 1;
                if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }

                const speed = player.speed * (input.keys.shift ? player.sprintMultiplier : 1);
                const newX = player.x + dx * speed * cappedDt;
                const newY = player.y + dy * speed * cappedDt;
                player.x = clamp(newX, 0, W - player.w);
                player.y = clamp(newY, 0, H - player.h);

                // زاویه
                const ang = Math.atan2(input.mouseY - (player.y + player.h/2), input.mouseX - (player.x + player.w/2));
                player.angle = ang;

                // چراغ قوه
                if (input.fPressed) {
                    player.flashlight = !player.flashlight;
                    input.fPressed = false;
                    updateHUD();
                }

                // شلیک
                if (input.spacePressed || input.mouseDown) shoot();

                // به‌روزرسانی گیم‌پد
                input.updateGamepad();

                // ---- بروزرسانی گلوله‌ها ----
                for (let i = activeBullets.length - 1; i >= 0; i--) {
                    const b = activeBullets[i];
                    b.x += b.vx * (cappedDt * 60);
                    b.y += b.vy * (cappedDt * 60);
                    b.life--;
                    if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20 || b.life <= 0) {
                        b.active = false;
                        bulletPool.release(b);
                        activeBullets.splice(i, 1);
                        continue;
                    }

                    let hit = false;
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const e = enemies[j];
                        if (e.dead) continue;
                        if (b.x > e.x && b.x < e.x + e.w &&
                            b.y > e.y && b.y < e.y + e.h) {
                            e.hp -= b.damage;
                            createParticles(b.x, b.y, e.color, 12, 4, 20);
                            if (e.hp <= 0) {
                                e.dead = true;
                                kills++;
                                score += e.score;
                                createParticles(e.x + e.w/2, e.y + e.h/2, '#ffd740', 25, 6, 30);
                                addFloatingText(e.x, e.y, \`+\${e.score} ⭐\`, '#ffd740');
                                screenShake = Math.max(screenShake, 4);

                                if (e.isBoss) {
                                    bossActive = false;
                                    bossDefeated = true;
                                    addFloatingText(W/2, 120, '🎉 غول شکست خورد!', '#ffd740', 34);
                                    createParticles(e.x + e.w/2, e.y + e.h/2, '#ff1744', 50, 10, 40);
                                    screenShake = 20;
                                    score += 50;
                                    for (let p = 0; p < 3; p++) {
                                        ammoPickups.push({
                                            x: e.x + rand(-30, 30) + e.w/2,
                                            y: e.y + rand(-30, 30) + e.h/2,
                                            w: 16, h: 16,
                                            collected: false,
                                            amount: 4
                                        });
                                    }
                                    for (let p = 0; p < 2; p++) {
                                        healthPickups.push({
                                            x: e.x + rand(-30, 30) + e.w/2,
                                            y: e.y + rand(-30, 30) + e.h/2,
                                            w: 16, h: 16,
                                            collected: false,
                                            amount: 25
                                        });
                                    }
                                    assets.playSound('boss', 0.4);
                                }
                            }
                            hit = true;
                            break;
                        }
                    }
                    if (hit) {
                        b.active = false;
                        bulletPool.release(b);
                        activeBullets.splice(i, 1);
                    }
                }

                // ---- دشمنان ----
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    if (e.dead) continue;

                    if (e.stunTimer > 0) {
                        e.stunTimer--;
                        if (e.stunTimer === 0) e.state = 'chase';
                        continue;
                    }

                    if (e.attackCooldown > 0) e.attackCooldown--;

                    const dx2 = (player.x + player.w/2) - (e.x + e.w/2);
                    const dy2 = (player.y + player.h/2) - (e.y + e.h/2);
                    const d = Math.sqrt(dx2*dx2 + dy2*dy2);

                    const chaseDist = e.isBoss ? 400 : 300;

                    if (d > 10 && d < chaseDist) {
                        const spd = e.speed * (1 + gameTime / 300000);
                        const mx = (dx2 / d) * spd * (cappedDt * 60);
                        const my = (dy2 / d) * spd * (cappedDt * 60);
                        e.x += mx;
                        e.y += my;
                        e.x = clamp(e.x, -30, W - e.w + 30);
                        e.y = clamp(e.y, -30, H - e.h + 30);
                    } else if (d >= chaseDist) {
                        e.patrolTimer += 0.02 * (cappedDt * 60);
                        e.x += Math.sin(e.patrolTimer) * 0.5 * (cappedDt * 60);
                        e.y += Math.cos(e.patrolTimer * 0.7) * 0.5 * (cappedDt * 60);
                        e.x = clamp(e.x, 20, W - e.w - 20);
                        e.y = clamp(e.y, 20, H - e.h - 20);
                    }

                    if (e.isBoss && e.hp / e.maxHp < e.rageThreshold && !e.rageMode) {
                        e.rageMode = true;
                        e.speed *= 1.4;
                        e.damage *= 1.3;
                        e.color = '#ff1744';
                        addFloatingText(e.x + e.w/2, e.y - 20, '🔥 خشم!', '#ff1744', 24);
                        createParticles(e.x + e.w/2, e.y + e.h/2, '#ff1744', 20, 5, 20);
                    }

                    if (rectCollide(e, player)) {
                        if (player.damageCooldown <= 0) {
                            const dmg = e.damage * (0.8 + Math.random() * 0.4);
                            player.hp -= dmg;
                            player.damageCooldown = 30;
                            screenShake = Math.max(screenShake, 10);
                            createParticles(player.x + player.w/2, player.y + player.h/2, '#f00', 20, 5, 25);
                            addFloatingText(player.x, player.y - 20, \`-\${Math.round(dmg)}\`, '#f00');
                            if (d > 5) {
                                e.x -= (dx2 / d) * 35;
                                e.y -= (dy2 / d) * 35;
                            }
                            e.stunTimer = 15;
                            e.state = 'stunned';
                            updateHUD();

                            if (player.hp <= 0) {
                                state = GameState.GAMEOVER;
                                statusEl.textContent = 'بازی تمام شد';
                                return;
                            }
                        }
                    }

                    if (e.isBoss && e.hp / e.maxHp < 0.3) {
                        e.eyeColor = '#FF0000';
                    }
                }

                // ---- آیتم‌ها ----
                for (let i = ammoPickups.length - 1; i >= 0; i--) {
                    const item = ammoPickups[i];
                    if (item.collected) continue;
                    if (rectCollide(player, item)) {
                        item.collected = true;
                        player.ammo = Math.min(player.maxAmmo, player.ammo + item.amount);
                        addFloatingText(item.x, item.y, \`+\${item.amount} 🔫\`, '#0f0');
                        createParticles(item.x, item.y, '#0f0', 8, 3, 15);
                        ammoPickups.splice(i, 1);
                        updateHUD();
                    }
                }

                for (let i = healthPickups.length - 1; i >= 0; i--) {
                    const item = healthPickups[i];
                    if (item.collected) continue;
                    if (rectCollide(player, item)) {
                        item.collected = true;
                        player.hp = Math.min(player.maxHp, player.hp + item.amount);
                        addFloatingText(item.x, item.y, \`+\${item.amount} ❤️\`, '#ff1744');
                        createParticles(item.x, item.y, '#ff1744', 8, 3, 15);
                        healthPickups.splice(i, 1);
                        updateHUD();
                    }
                }

                // ---- تولید دشمنان جدید ----
                const aliveEnemies = enemies.filter(e => !e.dead).length;
                const needMore = levelEnemyCount - enemiesSpawned;
                if (needMore > 0 && aliveEnemies < 3 + Math.floor(level / 2)) {
                    if (gameTime % 60 === 0 && Math.random() < 0.1) {
                        spawnEnemy(null);
                    }
                }

                // ---- بررسی باس ----
                if (!bossActive && !bossDefeated && enemiesSpawned >= levelEnemyCount) {
                    const alive = enemies.filter(e => !e.dead).length;
                    if (alive === 0) {
                        if (level % 5 === 0) {
                            spawnBoss();
                        } else {
                            levelComplete = true;
                            level++;
                            addFloatingText(W/2, 100, \`✅ مرحله \${level-1} کامل شد!\`, '#4CAF50', 30);
                            statusEl.textContent = \`مرحله \${level-1} کامل شد\`;
                            setTimeout(() => {
                                startLevel();
                            }, 1500);
                        }
                    }
                }

                if (bossDefeated && !bossActive) {
                    const alive = enemies.filter(e => !e.dead).length;
                    if (alive === 0) {
                        levelComplete = true;
                        level++;
                        addFloatingText(W/2, 100, \`🎉 مرحله \${level-1} با باس کامل شد!\`, '#ffd740', 30);
                        statusEl.textContent = \`مرحله \${level-1} با باس کامل شد\`;
                        setTimeout(() => {
                            startLevel();
                        }, 2000);
                        bossDefeated = false;
                    }
                }

                // ---- ذرات ----
                for (let i = activeParticles.length - 1; i >= 0; i--) {
                    const p = activeParticles[i];
                    p.x += p.vx * (cappedDt * 60);
                    p.y += p.vy * (cappedDt * 60);
                    p.vy += 0.05 * (cappedDt * 60);
                    p.life--;
                    p.size *= 0.98;
                    if (p.life <= 0 || p.size < 0.3) {
                        p.active = false;
                        particlePool.release(p);
                        activeParticles.splice(i, 1);
                    }
                }

                // ---- متن شناور ----
                for (let i = activeFloatTexts.length - 1; i >= 0; i--) {
                    const ft = activeFloatTexts[i];
                    ft.y += ft.vy * (cappedDt * 60);
                    ft.life--;
                    ft.vy *= 0.98;
                    if (ft.life <= 0) {
                        ft.active = false;
                        floatTextPool.release(ft);
                        activeFloatTexts.splice(i, 1);
                    }
                }

                // ---- لرزش ----
                if (screenShake > 0) screenShake *= 0.93;
                if (screenShake < 0.1) screenShake = 0;

                updateHUD();
            }

            // ----------------------------------------------------------------
            // 13. رسم (با استفاده از OffscreenCanvas در آینده)
            // ----------------------------------------------------------------
            function draw() {
                ctx.save();

                if (screenShake > 0.5) {
                    const sx = (Math.random() - 0.5) * screenShake * 1.8;
                    const sy = (Math.random() - 0.5) * screenShake * 1.8;
                    ctx.translate(sx, sy);
                }

                // پس‌زمینه
                const grad = ctx.createRadialGradient(500, 325, 100, 500, 325, 550);
                grad.addColorStop(0, '#1a1a3e');
                grad.addColorStop(0.4, '#0f0f2a');
                grad.addColorStop(0.7, '#080818');
                grad.addColorStop(1, '#000000');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                ctx.strokeStyle = 'rgba(40,40,80,0.12)';
                ctx.lineWidth = 1;
                for (let i = 0; i < W; i += 45) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i, H);
                    ctx.stroke();
                }
                for (let i = 0; i < H; i += 45) {
                    ctx.beginPath();
                    ctx.moveTo(0, i);
                    ctx.lineTo(W, i);
                    ctx.stroke();
                }

                ctx.fillStyle = 'rgba(255,255,200,0.02)';
                for (let i = 0; i < 8; i++) {
                    const lx = (i * 137 + Math.sin(gameTime * 0.001 + i) * 50) % W;
                    const ly = (i * 97 + Math.cos(gameTime * 0.001 + i * 2) * 30) % H;
                    ctx.beginPath();
                    ctx.arc(lx, ly, 30 + Math.sin(gameTime * 0.005 + i) * 15, 0, Math.PI * 2);
                    ctx.fill();
                }

                // تاریکی / چراغ قوه
                if (!player.flashlight) {
                    const grd = ctx.createRadialGradient(
                        player.x + player.w/2, player.y + player.h/2, 20,
                        player.x + player.w/2, player.y + player.h/2, 160
                    );
                    grd.addColorStop(0, 'rgba(0,0,0,0)');
                    grd.addColorStop(0.4, 'rgba(0,0,0,0.4)');
                    grd.addColorStop(0.7, 'rgba(0,0,0,0.7)');
                    grd.addColorStop(1, 'rgba(0,0,0,0.95)');
                    ctx.fillStyle = grd;
                    ctx.fillRect(0, 0, W, H);
                } else {
                    const ang = player.angle;
                    const grd = ctx.createRadialGradient(
                        player.x + player.w/2, player.y + player.h/2, 5,
                        player.x + player.w/2, player.y + player.h/2, 320
                    );
                    grd.addColorStop(0, 'rgba(255,255,220,0.12)');
                    grd.addColorStop(0.3, 'rgba(255,255,220,0.06)');
                    grd.addColorStop(0.7, 'rgba(255,255,220,0.02)');
                    grd.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = grd;
                    ctx.beginPath();
                    ctx.moveTo(player.x + player.w/2, player.y + player.h/2);
                    const spread = 0.75;
                    ctx.arc(player.x + player.w/2, player.y + player.h/2, 320, ang - spread, ang + spread);
                    ctx.closePath();
                    ctx.fill();

                    ctx.shadowColor = 'rgba(255,255,200,0.08)';
                    ctx.shadowBlur = 50;
                    ctx.strokeStyle = 'rgba(255,255,200,0.04)';
                    ctx.lineWidth = 35;
                    ctx.beginPath();
                    ctx.moveTo(player.x + player.w/2, player.y + player.h/2);
                    ctx.lineTo(
                        player.x + player.w/2 + Math.cos(ang) * 320,
                        player.y + player.h/2 + Math.sin(ang) * 320
                    );
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                // آیتم‌ها
                for (let item of ammoPickups) {
                    if (item.collected) continue;
                    const pulse = Math.sin(gameTime * 0.06 + item.x) * 0.15 + 1;
                    ctx.shadowColor = '#0f0';
                    ctx.shadowBlur = 20 * pulse;
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#0f0';
                    ctx.fillText('📦', item.x + 8, item.y + 8);
                    ctx.shadowBlur = 0;
                }

                for (let item of healthPickups) {
                    if (item.collected) continue;
                    const pulse = Math.sin(gameTime * 0.06 + item.y) * 0.15 + 1;
                    ctx.shadowColor = '#ff1744';
                    ctx.shadowBlur = 20 * pulse;
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#ff1744';
                    ctx.fillText('❤️', item.x + 8, item.y + 8);
                    ctx.shadowBlur = 0;
                }

                // دشمنان
                for (let e of enemies) {
                    if (e.dead) continue;
                    const cx = e.x + e.w/2;
                    const cy = e.y + e.h/2;
                    const size = e.w / 2;

                    ctx.shadowColor = e.color;
                    ctx.shadowBlur = e.isBoss ? 40 : 20;

                    const gradient = ctx.createRadialGradient(
                        cx - size * 0.2, cy - size * 0.2, size * 0.1,
                        cx, cy, size
                    );
                    gradient.addColorStop(0, e.colorLight || e.color);
                    gradient.addColorStop(0.5, e.color);
                    gradient.addColorStop(1, e.colorDark || e.color);
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(cx, cy, size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(cx - size * 0.3, cy - size * 0.2, size * 0.5, 0, Math.PI * 2);
                    ctx.stroke();

                    const eyeDist = size * 0.35;
                    const eyeSize = size * 0.25;

                    ctx.shadowColor = e.eyeColor;
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.ellipse(cx - eyeDist, cy - size * 0.05, eyeSize, eyeSize * 1.1, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(cx + eyeDist, cy - size * 0.05, eyeSize, eyeSize * 1.1, 0, 0, Math.PI * 2);
                    ctx.fill();

                    const lookAngle = Math.atan2(
                        (player.y + player.h/2) - cy,
                        (player.x + player.w/2) - cx
                    );
                    const lookOffset = eyeSize * 0.3;

                    ctx.shadowBlur = 0;
                    ctx.fillStyle = e.eyeColor;
                    ctx.beginPath();
                    ctx.arc(
                        cx - eyeDist + Math.cos(lookAngle) * lookOffset,
                        cy - size * 0.05 + Math.sin(lookAngle) * lookOffset * 0.6,
                        eyeSize * 0.6, 0, Math.PI * 2
                    );
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(
                        cx + eyeDist + Math.cos(lookAngle) * lookOffset,
                        cy - size * 0.05 + Math.sin(lookAngle) * lookOffset * 0.6,
                        eyeSize * 0.6, 0, Math.PI * 2
                    );
                    ctx.fill();

                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(
                        cx - eyeDist + Math.cos(lookAngle) * lookOffset * 1.1,
                        cy - size * 0.05 + Math.sin(lookAngle) * lookOffset * 0.7,
                        eyeSize * 0.25, 0, Math.PI * 2
                    );
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(
                        cx + eyeDist + Math.cos(lookAngle) * lookOffset * 1.1,
                        cy - size * 0.05 + Math.sin(lookAngle) * lookOffset * 0.7,
                        eyeSize * 0.25, 0, Math.PI * 2
                    );
                    ctx.fill();

                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.beginPath();
                    ctx.arc(
                        cx - eyeDist - eyeSize * 0.2,
                        cy - size * 0.05 - eyeSize * 0.3,
                        eyeSize * 0.2, 0, Math.PI * 2
                    );
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(
                        cx + eyeDist - eyeSize * 0.2,
                        cy - size * 0.05 - eyeSize * 0.3,
                        eyeSize * 0.2, 0, Math.PI * 2
                    );
                    ctx.fill();

                    ctx.shadowBlur = 0;
                    const mouthY = cy + size * 0.25;
                    const mouthW = size * 0.5;

                    ctx.fillStyle = e.mouthColor || '#000';
                    ctx.beginPath();
                    ctx.ellipse(cx, mouthY, mouthW, size * 0.15, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(cx, mouthY - size * 0.05, mouthW * 0.8, 0.1, Math.PI - 0.1);
                    ctx.stroke();

                    if (e.type === 'huggy' || e.isBoss) {
                        ctx.fillStyle = '#FFFFFF';
                        for (let t = -mouthW * 0.6; t < mouthW * 0.6; t += 6) {
                            ctx.fillRect(cx + t - 2, mouthY + size * 0.05, 4, 5);
                        }
                    }

                    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                    ctx.lineWidth = 2;
                    const browY = cy - size * 0.3;
                    ctx.beginPath();
                    ctx.moveTo(cx - eyeDist - eyeSize, browY);
                    ctx.lineTo(cx - eyeDist + eyeSize, browY - 3);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(cx + eyeDist - eyeSize, browY);
                    ctx.lineTo(cx + eyeDist + eyeSize, browY - 3);
                    ctx.stroke();

                    if (e.type === 'huggy' || e.isBoss) {
                        ctx.fillStyle = e.colorDark || '#1A237E';
                        ctx.beginPath();
                        ctx.ellipse(cx - size * 0.9, cy - size * 0.4, size * 0.2, size * 0.4, -0.3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.ellipse(cx + size * 0.9, cy - size * 0.4, size * 0.2, size * 0.4, 0.3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = e.colorLight || '#90CAF9';
                        ctx.beginPath();
                        ctx.ellipse(cx - size * 0.9, cy - size * 0.3, size * 0.1, size * 0.2, -0.3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.ellipse(cx + size * 0.9, cy - size * 0.3, size * 0.1, size * 0.2, 0.3, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    if (e.isBoss) {
                        ctx.shadowColor = '#ff1744';
                        ctx.shadowBlur = 40;
                        ctx.strokeStyle = \`rgba(255,23,68,\${0.2 + Math.sin(gameTime * 0.05) * 0.1})\`;
                        ctx.lineWidth = 3;
                        ctx.setLineDash([8, 8]);
                        ctx.beginPath();
                        ctx.arc(cx, cy, size + 10, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.setLineDash([]);
                        ctx.shadowBlur = 0;

                        ctx.fillStyle = '#ff1744';
                        ctx.font = 'bold 14px "Courier New", monospace';
                        ctx.textAlign = 'center';
                        ctx.shadowColor = '#ff1744';
                        ctx.shadowBlur = 20;
                        ctx.fillText(e.name, cx, cy - size - 18);
                        ctx.shadowBlur = 0;

                        if (e.rageMode) {
                            ctx.fillStyle = 'rgba(255,0,0,0.1)';
                            ctx.beginPath();
                            ctx.arc(cx, cy, size + 15, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }

                    if (e.hp < e.maxHp || e.isBoss) {
                        const bw = e.isBoss ? size * 1.6 : size * 1.2;
                        const bh = e.isBoss ? 6 : 4;
                        const by = cy - size - (e.isBoss ? 26 : 12);
                        ctx.fillStyle = 'rgba(0,0,0,0.6)';
                        ctx.fillRect(cx - bw/2, by, bw, bh);
                        const hpRatio = e.hp / e.maxHp;
                        ctx.fillStyle = hpRatio > 0.3 ? '#4CAF50' : '#ff1744';
                        ctx.fillRect(cx - bw/2, by, bw * Math.max(0, hpRatio), bh);
                        if (e.isBoss) {
                            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                            ctx.lineWidth = 1;
                            ctx.strokeRect(cx - bw/2, by, bw, bh);
                        }
                    }

                    if (e.stunTimer > 0) {
                        ctx.strokeStyle = \`rgba(255,255,0,\${0.3 + Math.sin(gameTime * 0.2) * 0.2})\`;
                        ctx.lineWidth = 2;
                        ctx.setLineDash([4, 6]);
                        ctx.beginPath();
                        ctx.arc(cx, cy, size + 4, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                }

                // گلوله‌ها
                for (let b of activeBullets) {
                    ctx.shadowColor = b.color;
                    ctx.shadowBlur = 25;
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(0,255,136,0.2)';
                    ctx.beginPath();
                    ctx.arc(b.x - b.vx * 0.4, b.y - b.vy * 0.4, b.radius * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // بازیکن
                const px = player.x, py = player.y;
                const cx2 = px + player.w/2, cy2 = py + player.h/2;

                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 20;
                ctx.shadowOffsetY = 5;

                ctx.shadowBlur = 10;
                ctx.fillStyle = '#1a2a3a';
                ctx.beginPath();
                ctx.roundRect(px + 2, py + 8, player.w - 4, player.h - 12, 4);
                ctx.fill();

                ctx.fillStyle = '#2a3a4a';
                ctx.beginPath();
                ctx.roundRect(px + 4, py + 12, player.w - 8, 14, 3);
                ctx.fill();

                ctx.shadowBlur = 8;
                ctx.fillStyle = '#2a4a3a';
                ctx.beginPath();
                ctx.arc(cx2, py + 6, 14, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#1a3a2a';
                ctx.fillRect(cx2 - 12, py - 2, 24, 4);
                ctx.fillRect(cx2 - 10, py + 2, 20, 2);

                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;

                const eyeAng = player.angle;
                const eyeOffX = Math.cos(eyeAng) * 3;
                const eyeOffY = Math.sin(eyeAng) * 2;

                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.arc(cx2 - 5 + eyeOffX, py + 4 + eyeOffY, 4.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(cx2 + 5 + eyeOffX, py + 4 + eyeOffY, 4.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#1A237E';
                ctx.beginPath();
                ctx.arc(cx2 - 3 + eyeOffX * 1.2, py + 5 + eyeOffY * 1.2, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(cx2 + 7 + eyeOffX * 1.2, py + 5 + eyeOffY * 1.2, 2.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.beginPath();
                ctx.arc(cx2 - 4 + eyeOffX, py + 3 + eyeOffY, 1.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(cx2 + 6 + eyeOffX, py + 3 + eyeOffY, 1.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#1A237E';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(cx2, py + 10, 5, 0.1, Math.PI - 0.1);
                ctx.stroke();

                if (player.flashlight) {
                    ctx.shadowColor = '#ffd740';
                    ctx.shadowBlur = 40;
                    ctx.fillStyle = '#ffd740';
                    ctx.beginPath();
                    ctx.arc(cx2 + Math.cos(player.angle) * 20, cy2 + Math.sin(player.angle) * 20, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                const wx = cx2 + Math.cos(player.angle) * 22;
                const wy = cy2 + Math.sin(player.angle) * 22;
                const wobble = player.weaponBob;

                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetY = 2;

                ctx.fillStyle = '#2a3a4a';
                ctx.fillRect(wx - 3, wy - 2 + wobble, 16, 4);
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(wx + 10, wy - 5 + wobble, 8, 10);
                ctx.fillStyle = '#2a2a3a';
                ctx.fillRect(wx + 12, wy - 3 + wobble, 4, 6);

                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;

                // ذرات
                for (let p of activeParticles) {
                    const alpha = p.life / (p.maxLife || 30);
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 15 * alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, Math.max(0.5, p.size * alpha), 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;

                // متن‌های شناور
                for (let ft of activeFloatTexts) {
                    const alpha = ft.life / ft.maxLife;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = ft.color;
                    ctx.font = \`bold \${ft.size}px "Courier New", monospace\`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = ft.color;
                    ctx.shadowBlur = 20 * alpha;
                    ctx.fillText(ft.text, ft.x, ft.y);
                    ctx.shadowBlur = 0;
                }
                ctx.globalAlpha = 1;

                // HUD روی بوم
                ctx.fillStyle = 'rgba(0,255,0,0.1)';
                ctx.font = '12px "Courier New", monospace';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillText(\`⏱ \${Math.floor(gameTime / 60)}s\`, 15, H - 15);
                ctx.textAlign = 'right';
                ctx.fillText(\`👾 \${enemies.filter(e => !e.dead).length}\`, W - 15, H - 15);

                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillStyle = player.flashlight ? 'rgba(255,255,200,0.2)' : 'rgba(255,0,0,0.1)';
                ctx.font = '28px Arial';
                ctx.fillText(player.flashlight ? '💡' : '🌑', W/2, 12);

                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.font = '14px "Courier New", monospace';
                const bossText = bossActive ? '⚠️ باس فعال!' : (bossDefeated ? '✅ باس کشته شد' : '');
                ctx.fillText(\`📊 مرحله \${level}  |  \${bossText}\`, 15, 15);

                if (state === GameState.GAMEOVER) {
                    ctx.fillStyle = 'rgba(0,0,0,0.85)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = '#ff1744';
                    ctx.font = 'bold 60px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = '#ff1744';
                    ctx.shadowBlur = 50;
                    ctx.fillText('💀 GAME OVER', W/2, H/2 - 50);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.font = '26px "Courier New", monospace';
                    ctx.fillText(\`امتیاز: \${score}  |  کشته‌ها: \${kills}  |  مرحله: \${level}\`, W/2, H/2 + 30);
                    ctx.fillStyle = '#888';
                    ctx.font = '18px "Courier New", monospace';
                    ctx.fillText('برای شروع مجدد کلیک کنید یا Enter بزنید', W/2, H/2 + 90);
                }

                if (state === GameState.MENU) {
                    ctx.fillStyle = '#0a0a0a';
                    ctx.fillRect(0, 0, W, H);

                    for (let i = 0; i < 60; i++) {
                        const x = (i * 37 + gameTime * 0.05) % W;
                        const y = (i * 53 + gameTime * 0.03) % H;
                        ctx.fillStyle = \`rgba(233,69,96,\${0.04 + Math.sin(gameTime*0.02 + i)*0.02})\`;
                        ctx.beginPath();
                        ctx.arc(x, y, 1.5 + Math.sin(gameTime*0.03 + i)*1, 0, Math.PI*2);
                        ctx.fill();
                    }

                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = '#e94560';
                    ctx.shadowBlur = 50;
                    ctx.fillStyle = '#e94560';
                    ctx.font = 'bold 56px "Courier New", monospace';
                    ctx.fillText('🔦 DOOM 3 × Poppy', W/2, 120);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#0f0';
                    ctx.font = '28px "Courier New", monospace';
                    ctx.fillText('🎪 ماجراجویی بی‌پایان', W/2, 175);

                    ctx.fillStyle = '#aaa';
                    ctx.font = '18px "Courier New", monospace';
                    ctx.fillText('هاگی واگی در تاریکی کمین کرده...', W/2, 225);

                    for (let i = 0; i < 4; i++) {
                        const ex = 180 + i * 220;
                        const ey = 400 + Math.sin(gameTime*0.015 + i*1.5) * 20;
                        ctx.shadowColor = '#ff1744';
                        ctx.shadowBlur = 30;
                        ctx.fillStyle = '#ff1744';
                        ctx.beginPath();
                        ctx.arc(ex - 12, ey, 10, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(ex + 12, ey, 10, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(ex - 10, ey + 1, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(ex + 14, ey + 1, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.fillStyle = '#666';
                    ctx.font = '15px "Courier New", monospace';
                    ctx.shadowBlur = 0;
                    ctx.fillText('🕹️ WASD حرکت | F چراغ | Space شلیک | R مهمات | Shift دویدن', W/2, 490);
                    ctx.fillStyle = '#0f0';
                    ctx.font = '22px "Courier New", monospace';
                    ctx.shadowColor = '#0f0';
                    ctx.shadowBlur = 20;
                    ctx.fillText('▶ کلیک کنید یا Enter بزنید', W/2, 555);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#444';
                    ctx.font = '13px "Courier New", monospace';
                    ctx.fillText('⭐ هر ۵ مرحله یک غول | مراحل نامحدود | سختی افزایشی', W/2, 600);
                }

                ctx.restore();
            }

            // ----------------------------------------------------------------
            // 14. حلقه اصلی با delta time
            // ----------------------------------------------------------------
            function gameLoop(timestamp) {
                if (!lastTimestamp) lastTimestamp = timestamp;
                deltaTime = (timestamp - lastTimestamp) / 1000;
                if (deltaTime > 0.1) deltaTime = 0.016; // جلوگیری از پرش
                lastTimestamp = timestamp;

                if (state === GameState.MENU) {
                    gameTime++;
                    draw();
                    requestAnimationFrame(gameLoop);
                    return;
                }

                update(deltaTime);
                draw();
                requestAnimationFrame(gameLoop);
            }

            // ----------------------------------------------------------------
            // 15. رویدادهای شروع
            // ----------------------------------------------------------------
            function handleStart() {
                if (state === GameState.MENU) startGame();
                else if (state === GameState.GAMEOVER) startGame();
            }

            canvas.addEventListener('click', handleStart);
            input.onKeyEnter(handleStart);

            // نمایش راهنمای کیبورد
            setTimeout(() => {
                const hint = document.getElementById('focus-hint');
                if (hint && state === GameState.MENU) {
                    hint.style.opacity = '1';
                    setTimeout(() => { hint.style.opacity = '0'; }, 6000);
                }
            }, 3000);

            // ----------------------------------------------------------------
            // 16. شروع
            // ----------------------------------------------------------------
            state = GameState.MENU;
            gameLoop(0);

            console.log('🔦 DOOM 3 × Poppy Playtime - نسخه ۲۰۲۶');
            console.log('🕹️ WASD حرکت | F چراغ | Space شلیک | R مهمات | Shift دویدن');
            console.log('👾 هر ۵ مرحله یک غول | مراحل نامحدود');

            // ----------------------------------------------------------------
            // polyfill roundRect
            // ----------------------------------------------------------------
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (r > w/2) r = w/2;
                    if (r > h/2) r = h/2;
                    this.moveTo(x + r, y);
                    this.lineTo(x + w - r, y);
                    this.quadraticCurveTo(x + w, y, x + w, y + r);
                    this.lineTo(x + w, y + h - r);
                    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    this.lineTo(x + r, y + h);
                    this.quadraticCurveTo(x, y + h, x, y + h - r);
                    this.lineTo(x, y + r);
                    this.quadraticCurveTo(x, y, x + r, y);
                    this.closePath();
                    return this;
                };
            }

            // تمیزکاری در صورت بسته شدن صفحه
            window.addEventListener('beforeunload', () => {
                input.destroy();
                bulletPool.clear();
                particlePool.clear();
                floatTextPool.clear();
            });

        `;

        // ================================================================
        // بارگذاری ماژول‌ها با Blob URL و import داینامیک
        // ================================================================
        async function loadModules() {
            const moduleMap = {
                './utils.js': utilsCode,
                './config.js': configCode,
                './InputManager.js': inputCode,
                './AssetManager.js': assetCode,
                './ObjectPool.js': poolCode,
                './main.js': mainCode
            };

            const blobs = {};
            for (const [path, code] of Object.entries(moduleMap)) {
                const blob = new Blob([code], { type: 'application/javascript' });
                blobs[path] = URL.createObjectURL(blob);
            }

            // بارگذاری main که به بقیه import می‌کند
            const mainURL = blobs['./main.js'];
            try {
                await import(mainURL);
            } catch (err) {
                console.error('خطا در بارگذاری ماژول اصلی:', err);
            }
        }

        loadModules();
    </script>
</body>
</html>
